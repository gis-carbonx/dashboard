*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<script>
'use strict';
const SHEET_ID='1ROa7ApqWNewNiI4wtV3pPHMdTDc02XrTypadPrkbM0s';
const INCIDENT_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
const MANHOURS_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=530829684`;

const str=v=>(v??'').toString().trim();
const num=v=>{
  const n=parseFloat(str(v).replace(/,/g,''));
  return isNaN(n)?0:n;
};
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoDate=v=>{const m=str(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:'';};
const toDate=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const toIso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso=()=>toIso(new Date());
const addDays=(iso,n)=>{const d=toDate(iso);d.setDate(d.getDate()+n);return toIso(d);};
const dayDiff=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const fmtDate=(iso,month='long')=>iso?toDate(iso).toLocaleDateString('id-ID',{day:'numeric',month,year:'numeric'}):'–';
const fmtMonth=(k,month='long')=>new Date(+k.slice(0,4),+k.slice(5,7)-1,1).toLocaleDateString('id-ID',{month,year:'numeric'});
// Jam kejadian ditulis desimal jam.menit (9.45 = 09.45)
const fmtJam=v=>{const s=str(v);if(!s)return'';const [h,m='0']=s.split(/[.:]/);return h.padStart(2,'0')+'.'+m.padEnd(2,'0').slice(0,2);};

function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

let incidents=[],mhRows=[],years=[];
let sortState={key:'date',dir:-1};
const openInc=new Set();

let currentYear='all',currentQuarter='all',currentMonth='all';
const QUARTERS=['1','2','3','4'];
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MN_S=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
// 'yq' = Tahun + Quarter/Bulan; 'ytd'/'mtd' mengabaikan ketiganya. Quarter dan bulan saling menggantikan
let periodMode='yq';
function fmtD(d){return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}

// Rentang tanggal [awal, akhir] periode terpilih; null = semua data
function periodRanges(){
  const now=new Date(),cy=now.getFullYear(),today=todayIso();
  if(periodMode==='ytd')return[[`${cy}-01-01`,today]];
  if(periodMode==='mtd')return[[`${cy}-${pad(now.getMonth()+1)}-01`,today]];
  if(currentYear==='all'&&currentQuarter==='all'&&currentMonth==='all')return null;
  const ys=currentYear==='all'?years:[+currentYear];
  return ys.map(y=>{
    if(currentMonth!=='all'){const m=+currentMonth;return[`${y}-${pad(m)}-01`,toIso(new Date(y,m,0))];}
    if(currentQuarter==='all')return[`${y}-01-01`,`${y}-12-31`];
    const q=+currentQuarter;
    return[`${y}-${pad((q-1)*3+1)}-01`,toIso(new Date(y,q*3,0))];
  });
}
const inPeriod=(iso,ranges)=>!ranges||ranges.some(([a,b])=>iso>=a&&iso<=b);

function periodLabel(){
  const now=new Date();
  if(periodMode==='ytd')return`1 Januari–${fmtD(now)}`;
  if(periodMode==='mtd')return`1–${fmtD(now)}`;
  const y=currentYear==='all'?'semua tahun':currentYear;
  if(currentMonth!=='all')return`${MN[+currentMonth-1]} ${y}`;
  if(currentQuarter!=='all')return`Q${currentQuarter} ${y}`;
  return currentYear==='all'?'Semua tahun':`Tahun ${currentYear}`;
}

function setFilter(y){currentYear=y;periodMode='yq';render();}
function setQuarter(q){currentQuarter=q;currentMonth='all';periodMode='yq';render();}
function setMonth(m){currentMonth=m;currentQuarter='all';periodMode='yq';render();}
function setPeriod(p){periodMode=p;render();}

function filterHTML(){
  const yq=periodMode==='yq';
  return`
    <div class="filter-row">
      <span class="filter-lbl">Filter</span>
      <button class="fpill${yq&&currentYear==='all'?' active':''}" onclick="setFilter('all')">All</button>
      ${years.map(y=>`<button class="fpill${yq&&currentYear===String(y)?' active':''}" onclick="setFilter('${y}')">${y}</button>`).join('')}
    </div>
    <div class="filter-row">
      <span class="filter-lbl">Quarter</span>
      <button class="fpill${yq&&currentQuarter==='all'&&currentMonth==='all'?' active':''}" onclick="setQuarter('all')">All</button>
      ${QUARTERS.map(q=>`<button class="fpill${yq&&currentQuarter===q?' active':''}" onclick="setQuarter('${q}')">Q${q}</button>`).join('')}
    </div>
    <div class="filter-row">
      <span class="filter-lbl">Bulan</span>
      <button class="fpill${yq&&currentMonth==='all'&&currentQuarter==='all'?' active':''}" onclick="setMonth('all')">All</button>
      ${MN_S.map((m,i)=>`<button class="fpill${yq&&currentMonth===String(i+1)?' active':''}" onclick="setMonth('${i+1}')">${m}</button>`).join('')}
    </div>
    <div class="filter-row last">
      <span class="filter-lbl">Periode</span>
      <button class="fpill${periodMode==='ytd'?' active':''}" onclick="setPeriod('ytd')">Year to Date</button>
      <button class="fpill${periodMode==='mtd'?' active':''}" onclick="setPeriod('mtd')">Month to Date</button>
    </div>`;
}

// Bulan yang ditampilkan grafik: rentang periode, dibatasi sampai bulan berjalan
function periodMonths(ranges,fallbackFrom,fallbackTo){
  const cur=todayIso().slice(0,7),out=new Set();
  (ranges||[[fallbackFrom,fallbackTo]]).forEach(([a,b])=>{
    if(!a||!b)return;
    let [y,m]=a.split('-').map(Number);
    const end=b.slice(0,7)<cur?b.slice(0,7):cur;
    for(let k=`${y}-${pad(m)}`;k<=end;){out.add(k);m++;if(m>12){m=1;y++;}k=`${y}-${pad(m)}`;}
  });
  return[...out].sort();
}
const TT_STYLE={displayColors:false,backgroundColor:'#fff',borderColor:'#DCDACC',borderWidth:1,cornerRadius:10,padding:10,
  titleColor:'#3A342C',titleFont:{family:'Libre Franklin',size:11.5,weight:'700'},
  bodyColor:'#6A665B',bodyFont:{family:'Libre Franklin',size:11}};
const AXIS_FONT={family:'Libre Franklin',size:9.5};
const subLines=(...lines)=>lines.map(([n,t],i)=>`<div class="card-sub-pct"${i?' style="margin-top:2px"':''}>${n===null?'':fmtInt(n)+' '}${t}</div>`).join('');
const sumKey=(list,k)=>list.reduce((a,i)=>a+i[k],0);

function parseIncidents(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  incidents=[];
  data.forEach(raw=>{
    const keys=Object.keys(raw);
    const g=(...n)=>pickCI(raw,keys,...n);
    const id=str(g('ID insiden'));
    const date=isoDate(g('Tanggal kejadian'));
    if(!id||!date)return;
    incidents.push({
      id,date,year:date.slice(0,4),
      jam:fmtJam(g('Jam kejadian')),
      lokasi:str(g('Lokasi')),area:str(g('Area / titik kejadian')),
      dept:str(g('Departemen')),
      aktivitas:str(g('Aktivitas saat kejadian')),
      ringkasan:str(g('Ringkasan kejadian')),
      jenis:str(g('Jenis kejadian'))||'Lainnya',
      fatality:num(g('Fatality (orang)')),lti:num(g('LTI (orang)')),
      mtc:num(g('Medical treatment (orang)')),fa:num(g('First aid (orang)')),rwc:num(g('RWC (orang)')),
      aset:str(g('Aset yang rusak')),
      properti:/^ya$/i.test(str(g('Properti Damaged'))),
      kendaraan:/^ya$/i.test(str(g('Vehicle Accidents'))),
      kebakaran:/^ya$/i.test(str(g('Fire Case'))),
      kerugian:num(g('Estimasi kerugian (Rp)'))+num(g('Estimasi kerugian kendaraan (Rp)'))+num(g('Estimasi kerugian kebakaran (Rp)')),
      hariHilang:num(g('Hari kerja hilang')),
      pic:str(g('PIC investigasi')),
      mulai:isoDate(g('Mulai investigasi')),target:isoDate(g('Target selesai investigasi')),
      selesai:isoDate(g('Tanggal selesai investigasi')),
      status:str(g('Status investigasi'))||'Belum diisi',
      progres:str(g('Update / progres investigasi')),
      akar:str(g('Akar penyebab')),tindakan:str(g('Rencana tindakan perbaikan')),
      bukti:str(g('Referensi laporan / bukti')),verifikator:str(g('Verifikator laporan')),
      tenggat:str(g('Status tenggat (otomatis)')),terlambat:num(g('Hari terlambat (otomatis)'))
    });
  });
  incidents.sort((a,b)=>b.date.localeCompare(a.date)||b.jam.localeCompare(a.jam));
}

function parseManhours(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  mhRows=[];
  data.forEach(raw=>{
    const keys=Object.keys(raw);
    const g=(...n)=>pickCI(raw,keys,...n);
    const month=isoDate(g('Bulan Pelaporan')).slice(0,7);
    const unit=str(g('Unit Kerja'));
    const start=isoDate(g('Tanggal Mulai'));
    if(!month||!unit||!start)return;
    mhRows.push({
      month,unit,start,end:isoDate(g('Tanggal Akhir'))||start,
      lokasi:str(g('Lokasi')),kelompok:str(g('Kelompok Pekerja')),
      manpower:num(g('Total Manpower')),manhours:num(g('Manhours Periode')),hariKerja:num(g('Hari Kerja Periode')),
      mpValid:num(g('Data Manpower Valid'))===1,mhValid:num(g('Data Manhours Valid'))===1
    });
  });
}

const UNIT_ORDER=['Staff Site','Staff HO','Agronomis','Biodiversity','Fire Patrol'];
const UNIT_COLOR={'Staff Site':'#356760','Staff HO':'#B5BBA9','Agronomis':'#8B7BB0','Biodiversity':'#4a7fc1','Fire Patrol':'#c2703f'};
const unitColor=u=>UNIT_COLOR[u]||'#9C998C';
const unitList=list=>{
  const s=[...new Set(list.map(r=>r.unit))];
  return[...UNIT_ORDER.filter(u=>s.includes(u)),...s.filter(u=>!UNIT_ORDER.includes(u)).sort()];
};

// Hari kerja sebuah baris ditebak dari kolom G (Hari Kerja Periode): ≥ hari kalender → setiap hari,
// ≤ jumlah Senin–Jumat → Senin–Jumat, selain itu Senin–Sabtu
const countDays=(a,b,mode)=>{
  let n=0;
  for(let d=toDate(a),e=toDate(b);d<=e;d.setDate(d.getDate()+1)){
    const w=d.getDay();
    if(mode==='all'||(mode==='wd'&&w>=1&&w<=5)||(mode==='ws'&&w>=1))n++;
  }
  return n;
};
function workMode(r){
  if(r._mode)return r._mode;
  const cal=dayDiff(r.start,r.end)+1,hk=r.hariKerja||cal;
  r._mode=hk>=cal?'all':hk<=countDays(r.start,r.end,'wd')?'wd':hk<=countDays(r.start,r.end,'ws')?'ws':'all';
  r._days=countDays(r.start,r.end,r._mode);
  return r._mode;
}

// Manhours satu baris yang jatuh di periode: proporsional terhadap hari kerja yang beririsan
// (baris bulanan penuh = 100%; dipakai untuk batang mingguan, Year/Month to Date, dan batas LTI)
function mhShare(r,ranges,after){
  const mode=workMode(r);
  if(!r._days)return 0;
  const lo0=after?addDays(after,1):'';
  let days=0;
  (ranges||[[r.start,r.end]]).forEach(([a,b])=>{
    const lo=[r.start,a,lo0].sort().pop(),hi=[r.end,b].sort()[0];
    if(hi>=lo)days+=countDays(lo,hi,mode);
  });
  return r.manhours*days/r._days;
}

// Manpower bulanan per unit: bulan yang dipecah karena insiden (reset LTI free) berisi pekerja yang sama,
// jadi diambil nilai terbesar kolom J per unit/kelompok/lokasi, bukan dijumlahkan
function manpowerByUnit(list){
  const seg={};
  list.forEach(r=>{const k=[r.month,r.unit,r.kelompok,r.lokasi].join('|');seg[k]=Math.max(seg[k]||0,r.manpower);});
  const by={};
  Object.entries(seg).forEach(([k,v])=>{
    const [m,u]=k.split('|'),o=by[m]||(by[m]={});
    o[u]=(o[u]||0)+v;
  });
  return by;
}
// Manpower suatu rentang = akumulasi manpower bulanan (bulan yang dipecah sudah memakai nilai terbesar)
function manpowerSum(list){
  const by=manpowerByUnit(list),unit={};
  let total=0;
  Object.values(by).forEach(o=>Object.entries(o).forEach(([u,v])=>{unit[u]=(unit[u]||0)+v;total+=v;}));
  const n=Object.keys(by).length;
  return{unit,total,avg:n?total/n:0};
}
// Untuk batang mingguan: minggu yang melintasi dua bulan berisi pekerja yang sama, jadi ambil bulan terbesar
function manpowerMax(list){
  const by=manpowerByUnit(list),unit={};
  let total=0;
  Object.values(by).forEach(o=>{
    total=Math.max(total,Object.values(o).reduce((a,v)=>a+v,0));
    Object.entries(o).forEach(([u,v])=>{unit[u]=Math.max(unit[u]||0,v);});
  });
  return{unit,total};
}
const mpRowsIn=ranges=>mhRows.filter(r=>r.mpValid&&(!ranges||ranges.some(([a,b])=>r.start<=b&&r.end>=a)));

// LTI free manhours = akumulasi manhours sejak LTI/fatality terakhir hingga akhir periode terpilih (maks. hari ini);
// bulan berjalan dihitung proporsional per hari sehingga bertambah setiap hari
function ltiFree(ranges){
  const today=todayIso();
  const end=ranges&&ranges.length?ranges.map(r=>r[1]).sort().pop():today;
  const asOf=end<today?end:today;
  const last=incidents.filter(i=>(i.lti>0||i.fatality>0)&&i.date<=asOf).map(i=>i.date).sort().pop()||'';
  const first=mhRows.filter(r=>r.mhValid).map(r=>r.start).sort()[0]||asOf;
  const total=mhRows.filter(r=>r.mhValid).reduce((a,r)=>a+mhShare(r,[[first,asOf]],last),0);
  return{last,asOf,total,days:Math.max(0,dayDiff(last||first,asOf))};
}

function bindSummary(){
  const p=document.getElementById('smPanel');
  if(!p)return;
  const on=ids=>{
    p.classList.add('hl');
    p.querySelectorAll('.sm-cell').forEach(c=>{const own=c.dataset.inc.split(' ');c.classList.toggle('on',ids.some(id=>own.includes(id)));});
    p.querySelectorAll('.sm-key').forEach(k=>k.classList.toggle('on',ids.includes(k.dataset.id)));
  };
  const off=()=>{p.classList.remove('hl');p.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));};
  p.querySelectorAll('.sm-key').forEach(k=>{
    k.addEventListener('mouseenter',()=>on([k.dataset.id]));k.addEventListener('focus',()=>on([k.dataset.id]));
    k.addEventListener('mouseleave',off);k.addEventListener('blur',off);
  });
  p.querySelectorAll('.sm-cell').forEach(c=>{
    if(!c.dataset.inc)return;
    c.addEventListener('mouseenter',()=>on(c.dataset.inc.split(' ')));
    c.addEventListener('mouseleave',off);
  });
}

// Satuan grafik mengikuti filter: per tahun (quarter/bulan lintas tahun), per minggu Sabtu–Jumat
// (quarter/bulan dalam satu tahun, Month to Date), selain itu per bulan
function periodBuckets(ranges,first){
  const today=todayIso();
  const yq=periodMode==='yq',sub=currentQuarter!=='all'||currentMonth!=='all';
  if(yq&&currentYear==='all'&&sub){
    const lbl=currentMonth!=='all'?MN_S[+currentMonth-1]:`Q${currentQuarter}`;
    return{unit:'per tahun',list:ranges.filter(([a])=>a<=today).map(([a,b])=>({from:a,to:b,tick:[lbl,a.slice(0,4)],title:`${lbl} ${a.slice(0,4)}`}))};
  }
  if(periodMode==='mtd'||(yq&&sub)){
    const [a,b]=ranges[0],end=b<today?b:today,list=[];
    let sat=toDate(a);sat.setDate(sat.getDate()-((sat.getDay()+1)%7));
    for(;toIso(sat)<=end;sat.setDate(sat.getDate()+7)){
      const fri=new Date(sat);fri.setDate(fri.getDate()+6);
      const from=toIso(sat)<a?a:toIso(sat),to=toIso(fri)>b?b:toIso(fri);
      const f=toDate(from),t=toDate(to);
      const s=f.getMonth()===t.getMonth()?`${f.getDate()}–${t.getDate()} ${MN_S[t.getMonth()]}`:`${f.getDate()} ${MN_S[f.getMonth()]}–${t.getDate()} ${MN_S[t.getMonth()]}`;
      list.push({from,to,tick:s,title:`${s} ${t.getFullYear()}`});
    }
    return{unit:'per minggu',list};
  }
  const months=periodMonths(ranges,first||today,today);
  return{unit:'per bulan',list:months.map((k,i)=>{
    const s=MN_S[+k.slice(5)-1];
    let from=`${k}-01`,to=toIso(new Date(+k.slice(0,4),+k.slice(5),0));
    const r=(ranges||[]).find(([a,b])=>a<=to&&b>=from);
    if(r){from=from<r[0]?r[0]:from;to=to>r[1]?r[1]:to;}
    return{from,to,tick:i===0||k.slice(5)==='01'?[s,k.slice(0,4)]:s,title:fmtMonth(k)};
  })};
}

  const head=`<tr><th class="r">No</th>${COLS.map(c=>{
    const on=sortState.key===c.key,aria=on?(sortState.dir>0?'ascending':'descending'):'none';
    return`<th class="sortable${on?' on':''}" aria-sort="${aria}"><button type="button" data-sort="${c.key}">${c.label}<span class="arr">${arrow(c.key)}</span></button></th>`;
  }).join('')}</tr>`;
  const sorted=inc.slice().sort((a,b)=>{
    const x=sortVal(a,sortState.key),y=sortVal(b,sortState.key);
    return(x<y?-1:x>y?1:0)*sortState.dir;
  });
  const rows=sorted.map((i,n)=>{
    const open=openInc.has(i.id);
    const korban=CLASSES.filter(c=>i[c.key]>0).map(c=>`${c.lbl}: ${fmtInt(i[c.key])}`).join(', ');
    const invest=[i.mulai?`mulai ${fmtDate(i.mulai)}`:'',i.target?`target ${fmtDate(i.target)}`:'',i.selesai?`selesai ${fmtDate(i.selesai)}`:''].filter(Boolean).join(' - ');
    const tenggat=i.tenggat?`${i.tenggat}${i.terlambat>0?` (${fmtInt(i.terlambat)} hari)`:''}`:'';
    return`
      <tr class="inc-row${open?' active':''}" data-id="${esc(i.id)}" tabindex="0" aria-expanded="${open}">
        <td class="r muted">${n+1}</td>
        <td>${fmtDate(i.date)}</td>
        <td>${esc(i.id)}</td>
        <td>${esc(i.lokasi)||'—'}</td>
        <td>${esc(i.area)||'—'}</td>
        <td>${esc(i.dept)||'—'}</td>
        <td>${esc(i.jenis)}</td>
        <td class="clip" title="${esc(i.aktivitas)}">${esc(i.aktivitas)||'—'}</td>
        <td>${worstClass(i)}</td>
        <td>${esc(i.status)}</td>
      </tr>
      <tr class="inc-detail${open?' open':''}"><td colspan="${COLS.length+1}"><div class="inc-grid">
        ${field('Ringkasan kejadian',i.ringkasan,true)}
        ${field('Jam kejadian',i.jam?i.jam+' WIB':'')}
        ${field('Korban',korban||'Tidak ada')}
        ${field('Akar penyebab',i.akar)}
        ${field('Rencana tindakan perbaikan',i.tindakan)}
        ${field('Update / progres investigasi',i.progres)}
        ${field('PIC investigasi',i.pic)}
        ${field('Periode investigasi',invest)}
        ${field('Status tenggat',tenggat)}
        ${field('Hari kerja hilang',fmtInt(i.hariHilang)+' hari')}
        ${field('Kerugian',i.aset&&i.aset!=='Tidak Ada'?`${i.aset} - Rp ${fmtInt(i.kerugian)}`:(i.kerugian?`Rp ${fmtInt(i.kerugian)}`:'Tidak ada'))}
        ${field('Bukti laporan',i.bukti)}
        ${field('Verifikator',i.verifikator)}
      </div></td></tr>`;
  }).join('');
  return`
    <div class="reg-head">
      <div class="row-head" style="margin:0">
        <div class="row-title">Register Insiden</div>
        <div class="row-desc">Deskripsi insiden kecelakaan kerja yang terjadi.</div>
      </div>
      <div class="count">${fmtInt(inc.length)} kejadian</div>
    </div>
    <div class="list"><table class="tbl">
      <thead>${head}</thead>
      <tbody>${rows}</tbody>
    </table>${inc.length?'':'<div class="empty">Tidak ada insiden pada periode ini.</div>'}</div>`;
}

function render(){
  const ranges=periodRanges();
  const inc=incidents.filter(i=>inPeriod(i.date,ranges));
  const periode=periodLabel();
  const page=document.getElementById('pageBody');
  page.innerHTML=`
    ${filterHTML()}
    <div class="row-head">
      <div class="row-title">Manhours</div>
      <div class="row-desc">Jam kerja dan jumlah pekerja per satuan waktu dan per unit kerja.</div>
    </div>
    ${manhoursHTML(ranges,periode,inc)}
    <div class="row-head">
      <div class="row-title">Ringkasan Insiden</div>
      <div class="row-desc">Ringkasan insiden kerja PT Citra Mulia Inti.</div>
    </div>
    ${summaryHTML(inc)}
    <div class="row-head">
      <div class="row-title">Tren dan Sebaran Kejadian</div>
      <div class="row-desc">Jumlah insiden per bulan dan per departemen.</div>
    </div>
    ${chartsHTML(inc,periode)}
    ${registerHTML(inc)}
  `;
  bindSummary();
  drawMhChart(ranges,inc);
  drawIncChart(ranges,inc);
  page.querySelectorAll('th button[data-sort]').forEach(b=>b.addEventListener('click',()=>setSort(b.dataset.sort)));
  page.querySelectorAll('.inc-row').forEach(tr=>{
    const toggle=()=>{
      const id=tr.dataset.id;
      if(openInc.has(id))openInc.delete(id);else openInc.add(id);
      const open=openInc.has(id);
      tr.classList.toggle('active',open);
      tr.nextElementSibling.classList.toggle('open',open);
      tr.setAttribute('aria-expanded',open);
    };
    tr.addEventListener('click',toggle);
    tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  });
}

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [incTxt,mhTxt]=await Promise.all([getText(INCIDENT_URL),getText(MANHOURS_URL)]);
    parseIncidents(incTxt);
    parseManhours(mhTxt);
    years=[...new Set([...incidents.map(i=>+i.year),...mhRows.filter(r=>r.mhValid).map(r=>+r.month.slice(0,4))])].sort((a,b)=>a-b);
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
<script src="auth-guard.js"></script>
