<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KTH</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#356760;--primary-md:#618273;--primary-lt:#B5BBA9;--primary-bg:#FFFAF3;
  --dark:#3A342C;
  --bg:#FFFAF3;--surface:#fff;--border:#DCDACC;--border-lt:#EDE7D8;
  --text:#1a2332;--text-2:#64748b;--text-3:#a0aec0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 20px 60px rgba(0,0,0,.2);
}
html,body{height:100%;overflow:hidden;font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column}

.site-navbar{
  flex-shrink:0;
  height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 32px;background-color:#FFFAF3;border-bottom:1px solid #DCDACC;
  font-family:'Libre Franklin',system-ui,sans-serif;
}
.site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
.site-navbar-brand img{width:26px;height:26px;object-fit:contain}
.site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:#356760}
.site-navbar-menu{display:flex;gap:32px;justify-self:center}
.site-navbar-menu a{text-decoration:none;color:#618273;font-size:13px;font-weight:500}
.site-navbar-menu a:hover,.site-navbar-menu a.active{color:#356760}
.site-navbar-spacer{justify-self:end}
@media (max-width:768px){
  .site-navbar{grid-template-columns:auto auto;padding:0 16px}
  .site-navbar-menu{gap:14px;justify-self:end}
  .site-navbar-spacer{display:none}
}

.dashboard-frame{flex:1;min-height:0;margin:0 28px 28px 28px;border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.10);background:#fff;overflow:hidden;display:flex;flex-direction:column}

.hero{background:var(--dark);color:#fff;padding:14px 0;flex-shrink:0}
.hero-inner{max-width:1180px;margin:0 auto;padding:0 36px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.2px}
.hero-date{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}

.body-row{flex:1;min-height:0;display:flex}

.page-scroll{flex:1;min-height:0;overflow-y:auto}
.content-row{max-width:1180px;margin:0 auto;padding:28px 36px 48px;display:flex;align-items:flex-start;gap:20px}

.side-menu{position:sticky;top:20px;width:84px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:22px}
.side-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text-2);cursor:pointer;background:none;border:none;font-family:inherit;text-align:center;width:100%}
.side-icon{font-size:10.5px;font-weight:800;letter-spacing:.2px;line-height:1}
.side-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;line-height:1.3;color:inherit}
.side-item:hover{color:var(--primary-md)}
.side-item.active{color:var(--primary)}
.side-item.disabled{color:var(--text-3);opacity:.55;cursor:default}
.side-item.disabled:hover{color:var(--text-3)}

.page-body-inner{flex:1;min-width:0}

.sec-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:18px}
.sub-title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 14px}
.page-note{font-size:12px;color:var(--text-2);line-height:1.65;margin:16px 0 28px}

.grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,260px));gap:16px;margin-bottom:28px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px}
.card-lbl{font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:10px}
.card-val-lg{font-size:22px;font-weight:800;color:var(--primary)!important;line-height:1}

.loading-note{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px}

/* --- KTH-specific, kept minimal & consistent with the card/sub-title system above --- */
.kth-block{border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.kth-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kth-name{font-size:15px;font-weight:800;color:var(--text)}
.kth-count{font-size:11px;color:var(--text-2)}
.block-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin:0 0 10px}
.block-lbl:not(:first-of-type){margin-top:18px}

.pengurus-row{display:flex;flex-wrap:wrap;gap:10px}
.person{display:flex;align-items:center;gap:8px;border:1px solid var(--border-lt);border-radius:20px;padding:5px 12px 5px 5px;background:var(--bg)}
.person-pic{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--border-lt);flex-shrink:0}
.person-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.person-role{font-size:10px;color:var(--text-2);line-height:1.3}

.activity-list{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.activity{flex:0 0 220px;scroll-snap-align:start;border:1px solid var(--border-lt);border-radius:12px;padding:12px 14px}
.activity-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.activity-meta{font-size:11px;color:var(--text-2);margin-bottom:6px}
.activity-desc{font-size:12px;color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.thumb-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--border-lt)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="hero">
    <div class="hero-inner">
      <div>
        <div class="hero-title">KTH</div>
        <div class="hero-date" id="heroDate">Memuat tanggal...</div>
      </div>
    </div>
  </div>

  <div class="body-row">
    <div class="page-scroll">
      <div class="content-row">
        <nav class="side-menu">
          <a class="side-item" href="planting-summary.html">
            <span class="side-icon">MP</span>
            <span class="side-lbl">Main<br>Page</span>
          </a>
          <a class="side-item" href="penanaman-program.html">
            <span class="side-icon">ARR</span>
            <span class="side-lbl">ARR<br>Program</span>
          </a>
          <a class="side-item" href="planting-summary.html#enrichmentSection">
            <span class="side-icon">ER</span>
            <span class="side-lbl">Enrichment</span>
          </a>
          <a class="side-item" href="nursery.html">
            <span class="side-icon">NR</span>
            <span class="side-lbl">Nursery</span>
          </a>
          <a class="side-item active" href="kth.html">
            <span class="side-icon">TH</span>
            <span class="side-lbl">KTH</span>
          </a>
        </nav>
        <div class="page-body-inner" id="pageBody"><div class="loading-note">Memuat data KTH...</div></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const SHEET_ID='1_8jR1z131_-9k3QVbsaGFRn8MY2JPPiEAgWOZliKo_k';
const NEWS_GID=0,PENGURUS_GID=859770829;
const NEWS_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${NEWS_GID}`;
const PENGURUS_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${PENGURUS_GID}`;

const str=v=>(v??'').toString().trim();
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
function parseDate(s){
  if(!s)return null;const c=str(s);
  const m=c.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const m2=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2)return new Date(+m2[3],+m2[1]-1,+m2[2]);
  const d=new Date(c);return isNaN(d)?null:d;
}
function fmtDate(d){
  return d?d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
}

async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

// Urutan tampil jabatan pengurus; jabatan lain tetap ikut, ditaruh setelah ini.
const ROLE_ORDER=['ketua','sekretaris','bendahara','anggota'];
function roleRank(j){
  const n=j.toLowerCase();
  const i=ROLE_ORDER.indexOf(n);
  return i===-1?ROLE_ORDER.length:i;
}

let kegiatanList=[],pengurusList=[];

function parseNews(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  kegiatanList=data.map(raw=>{
    const keys=Object.keys(raw);
    const kth=str(pickCI(raw,keys,'nama kth','Nama KTH'));
    const judul=str(pickCI(raw,keys,'Judul Kegiatan'));
    const deskripsi=str(pickCI(raw,keys,'Deskripsi Kegiatan'));
    const tanggal=parseDate(pickCI(raw,keys,'Tanggal Kegiatan'));
    const lokasi=str(pickCI(raw,keys,'Lokasi Kegiatan'));
    const fotos=[1,2,3,4].map(i=>str(pickCI(raw,keys,`dok_foto${i}`))).filter(Boolean);
    return{kth,judul,deskripsi,tanggal,lokasi,fotos};
  }).filter(r=>r.kth||r.judul);
}

function parsePengurus(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  pengurusList=data.map(raw=>{
    const keys=Object.keys(raw);
    const kth=str(pickCI(raw,keys,'Nama KTH'));
    const jabatan=str(pickCI(raw,keys,'Jabatan'));
    const nama=str(pickCI(raw,keys,'Nama Pengurus'));
    const alamat=str(pickCI(raw,keys,'Alamat Pengurus'));
    const foto=str(pickCI(raw,keys,'Foto'));
    return{kth,jabatan,nama,alamat,foto};
  }).filter(r=>r.kth||r.nama);
}

function groupByKth(){
  const map={};
  const order=[];
  const ensure=name=>{
    if(!map[name]){map[name]={pengurus:[],kegiatan:[]};order.push(name);}
    return map[name];
  };
  pengurusList.forEach(p=>{if(p.kth)ensure(p.kth).pengurus.push(p);});
  kegiatanList.forEach(k=>{if(k.kth)ensure(k.kth).kegiatan.push(k);});
  order.forEach(name=>{
    map[name].pengurus.sort((a,b)=>roleRank(a.jabatan)-roleRank(b.jabatan));
    map[name].kegiatan.sort((a,b)=>(b.tanggal?.getTime()||0)-(a.tanggal?.getTime()||0));
  });
  return{map,order};
}

function render(){
  const {map,order}=groupByKth();
  const jumlahKth=order.length;
  const jumlahKegiatan=kegiatanList.length;
  const jumlahPengurus=pengurusList.length;

  const blocks=order.map(name=>{
    const g=map[name];
    const pengurusHtml=g.pengurus.length?`
      <div class="block-lbl">Pengurus</div>
      <div class="pengurus-row">
        ${g.pengurus.map(p=>`
          <div class="person">
            ${p.foto?`<img class="person-pic" src="${esc(p.foto)}" alt="" loading="lazy">`:'<div class="person-pic"></div>'}
            <div>
              <div class="person-name">${esc(p.nama)||'—'}</div>
              <div class="person-role">${esc(p.jabatan)||'—'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `:'';

    const kegiatanHtml=g.kegiatan.length?`
      <div class="block-lbl">Kegiatan</div>
      <div class="activity-list">
        ${g.kegiatan.map(k=>`
          <div class="activity">
            <div class="activity-title">${esc(k.judul)||'Kegiatan'}</div>
            <div class="activity-meta">${[fmtDate(k.tanggal),esc(k.lokasi)].filter(Boolean).join(' · ')}</div>
            ${k.deskripsi?`<div class="activity-desc">${esc(k.deskripsi)}</div>`:''}
            ${k.fotos.length?`<div class="thumb-row">${k.fotos.map(f=>`<img class="thumb" src="${esc(f)}" alt="" loading="lazy">`).join('')}</div>`:''}
          </div>
        `).join('')}
      </div>
    `:'';

    return `
      <div class="kth-block">
        <div class="kth-head">
          <div class="kth-name">${esc(name)}</div>
          <div class="kth-count">${fmtInt(g.pengurus.length)} pengurus · ${fmtInt(g.kegiatan.length)} kegiatan</div>
        </div>
        ${pengurusHtml}
        ${kegiatanHtml}
      </div>
    `;
  }).join('');

  const body=`
    <div class="sec-title">KTH</div>
    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Jumlah KTH</div>
        <div class="card-val-lg">${fmtInt(jumlahKth)}</div>
      </div>
      <div class="card">
        <div class="card-lbl">Jumlah Kegiatan</div>
        <div class="card-val-lg">${fmtInt(jumlahKegiatan)}</div>
      </div>
      <div class="card">
        <div class="card-lbl">Jumlah Pengurus</div>
        <div class="card-val-lg">${fmtInt(jumlahPengurus)}</div>
      </div>
    </div>
    ${blocks||'<div class="loading-note">Belum ada data KTH.</div>'}
  `;
  document.getElementById('pageBody').innerHTML=body;
}

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [newsTxt,pengurusTxt]=await Promise.all([getText(NEWS_URL),getText(PENGURUS_URL)]);
    parseNews(newsTxt);
    parsePengurus(pengurusTxt);
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
</body>
</html>
