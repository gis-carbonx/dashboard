<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KTH</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#356760;--primary-md:#618273;--primary-lt:#B5BBA9;--primary-bg:#FFFAF3;
  --dark:#3A342C;
  --bg:#FFFAF3;--surface:#fff;--border:#DCDACC;--border-lt:#EDE7D8;
  --text:#1a2332;--text-2:#64748b;--text-3:#a0aec0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 20px 60px rgba(0,0,0,.2);
}
html,body{height:100%;overflow:hidden;font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column}

.site-navbar{
  flex-shrink:0;
  height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 32px;background-color:#FFFAF3;border-bottom:1px solid #DCDACC;
  font-family:'Libre Franklin',system-ui,sans-serif;
}
.site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
.site-navbar-brand img{width:26px;height:26px;object-fit:contain}
.site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:#356760}
.site-navbar-menu{display:flex;gap:32px;justify-self:center}
.site-navbar-menu a{text-decoration:none;color:#618273;font-size:13px;font-weight:500}
.site-navbar-menu a:hover,.site-navbar-menu a.active{color:#356760}
.site-navbar-spacer{justify-self:end}
@media (max-width:768px){
  .site-navbar{grid-template-columns:auto auto;padding:0 16px}
  .site-navbar-menu{gap:14px;justify-self:end}
  .site-navbar-spacer{display:none}
}

.dashboard-frame{flex:1;min-height:0;margin:0 28px 28px 28px;border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.10);background:#fff;overflow:hidden;display:flex;flex-direction:column}

.hero{background:var(--dark);color:#fff;padding:14px 0;flex-shrink:0}
.hero-inner{max-width:1180px;margin:0 auto;padding:0 36px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.2px}
.hero-date{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}

.body-row{flex:1;min-height:0;display:flex}

.page-scroll{flex:1;min-height:0;overflow-y:auto}
.content-row{max-width:1180px;margin:0 auto;padding:28px 36px 48px;display:flex;align-items:flex-start;gap:20px}

.side-menu{position:sticky;top:20px;width:60px;flex-shrink:0;background:var(--dark);border-radius:18px;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.side-item{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;flex-shrink:0;text-decoration:none;color:rgba(255,255,255,.5);cursor:pointer;background:none;border:none;transition:background .15s,color .15s}
.side-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-item:hover{background:rgba(255,255,255,.1);color:#fff}
.side-item.active{background:#fff;color:var(--dark);border-radius:50%}
.side-item.disabled{color:rgba(255,255,255,.22);cursor:default}
.side-item.disabled:hover{background:none;color:rgba(255,255,255,.22)}

.page-body-inner{flex:1;min-width:0}

.sec-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:18px}
.sub-title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 14px}
.page-note{font-size:12px;color:var(--text-2);line-height:1.65;margin:16px 0 28px}

.grid-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px}
.card-lbl{font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:10px}
.card-val-lg{font-size:22px;font-weight:800;color:var(--primary)!important;line-height:1}
.card-sub{font-size:10.5px;color:var(--text-2);font-weight:600;margin-top:5px}

.loading-note{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px}

/* --- KTH-specific, kept minimal & consistent with the card/sub-title system above --- */
.kth-block{border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.kth-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kth-name{font-size:15px;font-weight:800;color:var(--text)}
.kth-count{font-size:11px;color:var(--text-2)}
.block-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin:0 0 10px}
.block-lbl:not(:first-of-type){margin-top:18px}

.pengurus-row{display:flex;flex-wrap:wrap;gap:10px}
.person{display:flex;align-items:center;gap:8px;border:1px solid var(--border-lt);border-radius:20px;padding:5px 12px 5px 5px;background:var(--bg)}
.person-pic{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--border-lt);flex-shrink:0}
.person-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.person-role{font-size:10px;color:var(--text-2);line-height:1.3}
.person.female{border:2px solid #D99AAB;padding:4px 11px 4px 4px}
.person.female .person-pic{box-shadow:0 0 0 2.5px #B5627A}

.activity-list{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.activity{flex:0 0 220px;scroll-snap-align:start;border:1px solid var(--border-lt);border-radius:12px;padding:12px 14px}
.activity-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.activity-meta{font-size:11px;color:var(--text-2);margin-bottom:6px}
.activity-desc{font-size:12px;color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.thumb-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--border-lt);cursor:pointer;transition:transform .15s,box-shadow .15s}
.thumb:hover,.thumb:focus-visible{transform:scale(1.06);box-shadow:0 0 0 2px var(--primary);outline:none}

/* --- Lightbox foto kegiatan --- */
.lb{position:fixed;inset:0;z-index:1000;background:rgba(20,18,15,.86);display:none;align-items:center;justify-content:center;padding:56px 16px}
.lb.open{display:flex}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;max-height:100%}
.lb-img{max-width:min(1000px,100%);max-height:calc(100vh - 150px);border-radius:10px;object-fit:contain;background:#222}
.lb-cap{color:#eee;font-size:12.5px;text-align:center;line-height:1.5}
.lb-cap small{display:block;color:#bbb;font-size:11px}
.lb-btn{position:absolute;background:rgba(255,255,255,.12);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;font-family:inherit}
.lb-btn:hover{background:rgba(255,255,255,.25)}
.lb-close{top:14px;right:14px}
.lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.lb-next{right:14px;top:50%;transform:translateY(-50%)}
.lb-btn[hidden]{display:none}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="hero">
    <div class="hero-inner">
      <div>
        <div class="hero-title">KTH</div>
        <div class="hero-date" id="heroDate">Memuat tanggal...</div>
      </div>
    </div>
  </div>

  <div class="body-row">
    <div class="page-scroll">
      <div class="content-row">
        <nav class="side-menu">
          <a class="side-item" href="planting-summary.html" title="Main Page" aria-label="Main Page"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10v9.5a1 1 0 0 0 1 1h3v-6h3v6h3a1 1 0 0 0 1-1V10"/></svg></a>
          <a class="side-item" href="penanaman-program.html" title="Monitoring" aria-label="Monitoring"><svg viewBox="0 0 24 24"><path d="M12 3c3.2 2.1 5.2 5.1 5.2 8.2a5.2 5.2 0 1 1-10.4 0C6.8 8.1 8.8 5.1 12 3Z"/><path d="M12 15.8V21"/></svg></a>
          <a class="side-item" href="nursery.html" title="Nursery" aria-label="Nursery"><svg viewBox="0 0 24 24"><path d="M12 11V5"/><path d="M12 5c-1.6 0-2.9 1-2.9 2.6C10.7 7.6 12 6.6 12 5Z"/><path d="M12 5c1.6 0 2.9 1 2.9 2.6C13.3 7.6 12 6.6 12 5Z"/><path d="M7 11h10l-1.1 8a2 2 0 0 1-2 1.7h-3.8a2 2 0 0 1-2-1.7L7 11Z"/></svg></a>
          <a class="side-item active" href="kth.html" title="KTH" aria-label="KTH"><svg viewBox="0 0 24 24"><circle cx="9.2" cy="8.3" r="2.9"/><path d="M3.5 19.5c0-3.1 2.5-5.7 5.7-5.7s5.7 2.6 5.7 5.7"/><circle cx="16.8" cy="9" r="2.2"/><path d="M15.4 13.9c2.4.5 4.1 2.6 4.1 5.1"/></svg></a>
        </nav>
        <div class="page-body-inner" id="pageBody"><div class="loading-note">Memuat data KTH...</div></div>
      </div>
    </div>
  </div>
</div>

<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto kegiatan">
  <button type="button" class="lb-btn lb-close" data-lb="close" aria-label="Tutup">&times;</button>
  <button type="button" class="lb-btn lb-prev" data-lb="prev" aria-label="Foto sebelumnya">&#8249;</button>
  <figure class="lb-fig">
    <img class="lb-img" id="lbImg" alt="">
    <figcaption class="lb-cap" id="lbCap"></figcaption>
  </figure>
  <button type="button" class="lb-btn lb-next" data-lb="next" aria-label="Foto berikutnya">&#8250;</button>
</div>

<script>
'use strict';
const SHEET_ID='1_8jR1z131_-9k3QVbsaGFRn8MY2JPPiEAgWOZliKo_k';
const NEWS_GID=0,PENGURUS_GID=859770829;
const NEWS_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${NEWS_GID}`;
const PENGURUS_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${PENGURUS_GID}`;
// Data peserta (petani) diambil dari sheet ARR_SUMMARY yang sama dengan planting-summary.html
const ARR_SHEET_ID='1-LHCIUy1iD154WczY4Da_-iRaILtvL0mOW4gRW6YQac';
const PESERTA_URL=`https://docs.google.com/spreadsheets/d/${ARR_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=ARR_SUMMARY`;

const str=v=>(v??'').toString().trim();
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
function parseDate(s){
  if(!s)return null;const c=str(s);
  const m=c.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const m2=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2)return new Date(+m2[3],+m2[1]-1,+m2[2]);
  const d=new Date(c);return isNaN(d)?null:d;
}
function fmtDate(d){
  return d?d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
}

async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

// Urutan tampil jabatan pengurus (dicocokkan per kata kunci, "wakil" dicek sebelum "ketua").
// Jabatan lain (seksi, koordinator, dll) ditaruh setelah sekretaris; anggota paling akhir.
function roleRank(j){
  const n=j.toLowerCase();
  if(/wakil/.test(n))return 1;
  if(/ketua/.test(n))return 0;
  if(/bendahara/.test(n))return 2;
  if(/sek(retaris|ertaris)/.test(n))return 3;
  if(/anggota/.test(n))return 5;
  return 4;
}

let kegiatanList=[],pengurusList=[],peserta=null;

// Peserta unik = petani yang tergabung di KTH (kolom KTH berisi "KTH") dan jenis kelaminnya terisi,
// sama seperti hitungan "Unik Peserta Program" di planting-summary.html.
function parsePeserta(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  const byName={};
  data.forEach(raw=>{
    const keys=Object.keys(raw);
    const kth=str(pickCI(raw,keys,'KTH')).toLowerCase();
    const petani=str(pickCI(raw,keys,'Petani')).toLowerCase();
    const jk=str(pickCI(raw,keys,'Jenis Kelamin','Jenis_Kelamin')).toLowerCase();
    if(!kth.includes('kth')||!petani||!jk||byName[petani])return;
    byName[petani]=jk[0];
  });
  const list=Object.values(byName);
  peserta={total:list.length,l:list.filter(j=>j==='l').length,p:list.filter(j=>j==='p').length};
}

function parseNews(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  kegiatanList=data.map(raw=>{
    const keys=Object.keys(raw);
    const kth=str(pickCI(raw,keys,'nama kth','Nama KTH'));
    const judul=str(pickCI(raw,keys,'Judul Kegiatan'));
    const deskripsi=str(pickCI(raw,keys,'Deskripsi Kegiatan'));
    const tanggal=parseDate(pickCI(raw,keys,'Tanggal Kegiatan'));
    const lokasi=str(pickCI(raw,keys,'Lokasi Kegiatan'));
    const fotos=[1,2,3,4].map(i=>str(pickCI(raw,keys,`dok_foto${i}`))).filter(Boolean);
    return{kth,judul,deskripsi,tanggal,lokasi,fotos};
  }).filter(r=>r.kth||r.judul);
}

function parsePengurus(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  pengurusList=data.map(raw=>{
    const keys=Object.keys(raw);
    const kth=str(pickCI(raw,keys,'Nama KTH'));
    const jabatan=str(pickCI(raw,keys,'Jabatan'));
    const nama=str(pickCI(raw,keys,'Nama Pengurus'));
    const alamat=str(pickCI(raw,keys,'Alamat Pengurus'));
    const foto=str(pickCI(raw,keys,'Foto'));
    const jk=str(pickCI(raw,keys,'Jelamin','Jenis Kelamin','Jenis_Kelamin')).toUpperCase();
    return{kth,jabatan,nama,alamat,foto,female:jk==='P'};
  }).filter(r=>r.kth||r.nama);
}

function groupByKth(){
  const map={};
  const order=[];
  const ensure=name=>{
    if(!map[name]){map[name]={pengurus:[],kegiatan:[]};order.push(name);}
    return map[name];
  };
  pengurusList.forEach(p=>{if(p.kth)ensure(p.kth).pengurus.push(p);});
  kegiatanList.forEach(k=>{if(k.kth)ensure(k.kth).kegiatan.push(k);});
  order.forEach(name=>{
    map[name].pengurus.sort((a,b)=>roleRank(a.jabatan)-roleRank(b.jabatan));
    map[name].kegiatan.sort((a,b)=>(b.tanggal?.getTime()||0)-(a.tanggal?.getTime()||0));
  });
  return{map,order};
}

function render(){
  const {map,order}=groupByKth();
  const jumlahKth=order.length;
  const jumlahKegiatan=kegiatanList.length;
  const jumlahPengurus=pengurusList.length;

  const blocks=order.map(name=>{
    const g=map[name];
    const pengurusHtml=g.pengurus.length?`
      <div class="block-lbl">Pengurus</div>
      <div class="pengurus-row">
        ${g.pengurus.map(p=>`
          <div class="person${p.female?' female':''}">
            ${p.foto?`<img class="person-pic" src="${esc(p.foto)}" alt="" loading="lazy">`:'<div class="person-pic"></div>'}
            <div>
              <div class="person-name">${esc(p.nama)||'—'}</div>
              <div class="person-role">${esc(p.jabatan)||'—'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `:'';

    const kegiatanHtml=g.kegiatan.length?`
      <div class="block-lbl">Kegiatan</div>
      <div class="activity-list">
        ${g.kegiatan.map(k=>`
          <div class="activity">
            <div class="activity-title">${esc(k.judul)||'Kegiatan'}</div>
            <div class="activity-meta">${[fmtDate(k.tanggal),esc(k.lokasi)].filter(Boolean).join(' · ')}</div>
            ${k.deskripsi?`<div class="activity-desc">${esc(k.deskripsi)}</div>`:''}
            ${k.fotos.length?`<div class="thumb-row">${k.fotos.map((f,i)=>`<img class="thumb" src="${esc(f)}" alt="" loading="lazy" data-k="${kegiatanList.indexOf(k)}" data-i="${i}" tabindex="0" role="button" aria-label="Perbesar foto ${i+1}">`).join('')}</div>`:''}
          </div>
        `).join('')}
      </div>
    `:'';

    return `
      <div class="kth-block">
        <div class="kth-head">
          <div class="kth-name">${esc(name)}</div>
          <div class="kth-count">${fmtInt(g.pengurus.length)} pengurus · ${fmtInt(g.kegiatan.length)} kegiatan</div>
        </div>
        ${pengurusHtml}
        ${kegiatanHtml}
      </div>
    `;
  }).join('');

  const body=`
    <div class="sec-title">KTH</div>
    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Jumlah KTH</div>
        <div class="card-val-lg">${fmtInt(jumlahKth)}</div>
      </div>
      <div class="card">
        <div class="card-lbl">Jumlah Kegiatan</div>
        <div class="card-val-lg">${fmtInt(jumlahKegiatan)}</div>
      </div>
      <div class="card">
        <div class="card-lbl">Jumlah Pengurus</div>
        <div class="card-val-lg">${fmtInt(jumlahPengurus)}</div>
      </div>
      ${peserta?`<div class="card">
        <div class="card-lbl">Peserta Unik Tergabung</div>
        <div class="card-val-lg">${fmtInt(peserta.total)}</div>
        <div class="card-sub">${fmtInt(peserta.l)} laki-laki, ${fmtInt(peserta.p)} perempuan</div>
      </div>`:''}
    </div>
    ${blocks||'<div class="loading-note">Belum ada data KTH.</div>'}
  `;
  document.getElementById('pageBody').innerHTML=body;
}

// Lightbox: klik foto kegiatan untuk memperbesar; panah kiri/kanan untuk foto lain di kegiatan yang sama
const lb={el:document.getElementById('lightbox'),img:document.getElementById('lbImg'),cap:document.getElementById('lbCap'),k:null,i:0,last:null};
function lbShow(){
  const k=kegiatanList[lb.k],n=k.fotos.length;
  lb.img.src=k.fotos[lb.i];
  lb.cap.innerHTML=`${esc(k.judul)||'Kegiatan'}<small>${[fmtDate(k.tanggal),esc(k.lokasi),n>1?`Foto ${lb.i+1} dari ${n}`:''].filter(Boolean).join(' · ')}</small>`;
  lb.el.querySelector('.lb-prev').hidden=lb.el.querySelector('.lb-next').hidden=n<2;
}
function lbOpen(k,i,trigger){
  lb.k=k;lb.i=i;lb.last=trigger;
  lbShow();
  lb.el.classList.add('open');
  document.body.style.overflow='hidden';
  lb.el.querySelector('.lb-close').focus();
}
function lbClose(){
  lb.el.classList.remove('open');
  lb.img.removeAttribute('src');
  document.body.style.overflow='';
  lb.last?.focus();
}
function lbStep(d){
  const n=kegiatanList[lb.k].fotos.length;
  lb.i=(lb.i+d+n)%n;lbShow();
}
document.getElementById('pageBody').addEventListener('click',e=>{
  const t=e.target.closest('.thumb[data-k]');
  if(t)lbOpen(+t.dataset.k,+t.dataset.i,t);
});
document.getElementById('pageBody').addEventListener('keydown',e=>{
  const t=e.target.closest('.thumb[data-k]');
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();lbOpen(+t.dataset.k,+t.dataset.i,t);}
});
lb.el.addEventListener('click',e=>{
  const a=e.target.closest('[data-lb]')?.dataset.lb;
  if(a==='close'||e.target===lb.el)lbClose();
  else if(a==='prev')lbStep(-1);
  else if(a==='next')lbStep(1);
});
document.addEventListener('keydown',e=>{
  if(!lb.el.classList.contains('open'))return;
  if(e.key==='Escape')lbClose();
  else if(e.key==='ArrowLeft')lbStep(-1);
  else if(e.key==='ArrowRight')lbStep(1);
});

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [newsTxt,pengurusTxt,pesertaTxt]=await Promise.all([getText(NEWS_URL),getText(PENGURUS_URL),getText(PESERTA_URL).catch(()=>'')]);
    parseNews(newsTxt);
    parsePengurus(pengurusTxt);
    if(pesertaTxt)parsePeserta(pesertaTxt);
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
</body>
</html>
