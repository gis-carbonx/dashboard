<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Nursery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#356760;--primary-md:#618273;--primary-lt:#B5BBA9;--primary-bg:#FFFAF3;
  --dark:#3A342C;
  --bg:#FFFAF3;--surface:#fff;--border:#DCDACC;--border-lt:#EDE7D8;
  --text:#1a2332;--text-2:#64748b;--text-3:#a0aec0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 20px 60px rgba(0,0,0,.2);
}
html,body{height:100%;overflow:hidden;font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column}

.site-navbar{
  flex-shrink:0;
  height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 32px;background-color:#FFFAF3;border-bottom:1px solid #DCDACC;
  font-family:'Libre Franklin',system-ui,sans-serif;
}
.site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
.site-navbar-brand img{width:26px;height:26px;object-fit:contain}
.site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:#356760}
.site-navbar-menu{display:flex;gap:32px;justify-self:center}
.site-navbar-menu a{text-decoration:none;color:#618273;font-size:13px;font-weight:500}
.site-navbar-menu a:hover,.site-navbar-menu a.active{color:#356760}
.site-navbar-spacer{justify-self:end}
@media (max-width:768px){
  .site-navbar{grid-template-columns:auto auto;padding:0 16px}
  .site-navbar-menu{gap:14px;justify-self:end}
  .site-navbar-spacer{display:none}
}

.dashboard-frame{flex:1;min-height:0;margin:0 28px 28px 28px;border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.10);background:#fff;overflow:hidden;display:flex;flex-direction:column}

.hero{background:var(--dark);color:#fff;padding:14px 0;flex-shrink:0}
.hero-inner{max-width:1180px;margin:0 auto;padding:0 36px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.2px}
.hero-date{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}

.body-row{flex:1;min-height:0;display:flex}

.page-scroll{flex:1;min-height:0;overflow-y:auto}
.content-row{max-width:1180px;margin:0 auto;padding:28px 36px 48px;display:flex;align-items:flex-start;gap:20px}

.side-menu-wrap{position:fixed;top:150px;left:24px;z-index:40;width:22px}
.menu-toggle{width:22px;height:22px;border-radius:50%;background:transparent;border:2.5px solid var(--text-2);cursor:pointer;padding:0}
.menu-toggle:hover{border-color:var(--primary-md)}
.side-menu{position:fixed;top:186px;left:24px;z-index:30;width:84px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 10px 28px rgba(0,0,0,.14);touch-action:none}
.menu-drag-handle{width:28px;height:6px;border-radius:3px;background:var(--border);cursor:grab;flex-shrink:0;user-select:none}
.menu-drag-handle:hover{background:var(--primary-lt)}
.menu-drag-handle:active{cursor:grabbing}
.side-menu.is-hidden{display:none}
.side-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text-2);cursor:pointer;background:none;border:none;font-family:inherit;text-align:center;width:100%}
.side-icon{font-size:10.5px;font-weight:800;letter-spacing:.2px;line-height:1}
.side-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;line-height:1.3;color:inherit}
.side-item:hover{color:var(--primary-md)}
.side-item.active{color:var(--primary)}
.side-item.disabled{color:var(--text-3);opacity:.55;cursor:default}
.side-item.disabled:hover{color:var(--text-3)}

.page-body-inner{flex:1;min-width:0}

.sec-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:18px}
.sub-title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 14px}
.page-note{font-size:12px;color:var(--text-2);line-height:1.65;margin:16px 0 28px}

.grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,260px));gap:16px;margin-bottom:28px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px}
.card-lbl{font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:10px}
.card-val-lg{font-size:22px;font-weight:800;color:var(--primary)!important;line-height:1}

.loading-note{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="hero">
    <div class="hero-inner">
      <div>
        <div class="hero-title">Nursery</div>
        <div class="hero-date" id="heroDate">Memuat tanggal...</div>
      </div>
    </div>
  </div>

  <div class="body-row">
    <div class="page-scroll">
      <div class="content-row">
        <div class="side-menu-wrap" id="sideMenuWrap">
        <button class="menu-toggle" id="menuToggleBtn" onclick="toggleSideMenu()" title="Tampilkan/sembunyikan menu"></button>
        <nav class="side-menu" id="sideMenu">
          <div class="menu-drag-handle" onpointerdown="menuPanelPointerDown(event)" title="Tahan &amp; geser untuk memindahkan menu"></div>
          <a class="side-item" href="planting-summary.html">
            <span class="side-icon">MP</span>
            <span class="side-lbl">Main<br>Page</span>
          </a>
          <a class="side-item" href="penanaman-program.html">
            <span class="side-icon">ARR</span>
            <span class="side-lbl">ARR<br>Program</span>
          </a>
          <a class="side-item" href="planting-summary.html#enrichmentSection">
            <span class="side-icon">ER</span>
            <span class="side-lbl">Enrichment</span>
          </a>
          <a class="side-item active" href="nursery.html">
            <span class="side-icon">NR</span>
            <span class="side-lbl">Nursery</span>
          </a>
          <span class="side-item disabled">
            <span class="side-icon">TH</span>
            <span class="side-lbl">KTH</span>
          </span>
        </nav>
        </div>
        <div class="page-body-inner" id="pageBody"><div class="loading-note">Memuat data nursery...</div></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const SHEET_ID='1or3IIjtpas5QD8PRAfO8WdhW6iTc-xH7v0B7hNOAF5M',SHEET_NAME='Log';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

const str=v=>(v??'').toString().trim();
const num=v=>{
  const c=str(v).replace(/,/g,'');
  const n=parseFloat(c);
  return isNaN(n)?0:n;
};
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}

async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

// --- Klasifikasi kategori (kolom "Category") ---
// Dipecah lebih rinci karena "Jumlah Tanaman di Nursery" sekarang dihitung sebagai
// snapshot langsung (jumlah baris pada tahap-tahap tertentu), BUKAN model masuk-keluar.
// "Semai Biji" dan "Grafting" (bare, bukan Pembesaran/BST Grafting) sengaja TIDAK
// dihitung sebagai bagian dari stok nursery, begitu juga kategori "Mati" dan kategori
// output (Penanaman/Penyulaman/Support).
function classifyCategory(raw){
  const n=str(raw).toLowerCase().replace(/[^a-z]/g,'');
  if(!n)return'none';
  if(n.includes('mati'))return'mati';
  if(n.includes('penanaman'))return'penanaman';
  if(n.includes('penyulaman'))return'penyulaman';
  if(n.includes('support'))return'support';
  if(n.includes('rootstock')){
    if(n.includes('bst'))return'bst_rootstock_return';
    if(n.includes('pembesaran'))return'pembesaran_rootstock_return';
    return'rootstock_return';
  }
  if(n.includes('grafting')){
    if(n.includes('bst'))return'bst_grafting';
    if(n.includes('pembesaran'))return'pembesaran_grafting';
    return'grafting'; // Grafting mentah -> tidak dihitung sebagai stok nursery
  }
  if(n.includes('semai'))return'semai'; // Semai Biji -> tidak dihitung sebagai stok nursery
  if(n.includes('pembesaran'))return'pembesaran_reguler';
  if(n.includes('bst'))return'bst_reguler';
  return'other';
}

// "Jumlah Tanaman di Nursery" HANYA dihitung dari 6 kategori tahap ini (persis):
// Pembesaran - Regular, Pembesaran - Grafting, Pembesaran - Rootstock Return,
// BST - Regular, BST - Grafting, BST - Rootstock Return.
// Kategori lain (Semai Biji, Grafting mentah, Rootstock Return mentah, Mati, dan
// output Penanaman/Penyulaman/Support) TIDAK ikut dihitung.
const STOCK_INCLUDED=new Set(['pembesaran_reguler','pembesaran_grafting','pembesaran_rootstock_return','bst_reguler','bst_grafting','bst_rootstock_return']);

let totalSemai=0,jumlahDiNursery=0;

function parseSheet(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  let semai=0,stock=0;
  data.forEach(raw=>{
    const keys=Object.keys(raw);
    const category=str(pickCI(raw,keys,'Category')||'');
    const jumlah=num(pickCI(raw,keys,'Jumlah'));
    if(!category)return;
    const cls=classifyCategory(category);
    if(cls==='semai')semai+=jumlah;
    if(STOCK_INCLUDED.has(cls))stock+=jumlah;
  });
  totalSemai=semai;
  jumlahDiNursery=stock;
}

function render(){
  const body=`
    <div class="sec-title">Nursery</div>
    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Jumlah Tanaman di Nursery</div>
        <div class="card-val-lg">${fmtInt(jumlahDiNursery)}</div>
      </div>
      <div class="card">
        <div class="card-lbl">Total Bibit Semai (Sepanjang Waktu)</div>
        <div class="card-val-lg">${fmtInt(totalSemai)}</div>
      </div>
    </div>
  `;
  document.getElementById('pageBody').innerHTML=body;
}

// --- Toggle sidebar menu (on/off); lingkaran diam, panel menu bisa digeser lewat pegangan kecil ---
const MENU_KEY='sanggala_menu_hidden';
const MENU_POS_KEY='sanggala_menu_panel_pos';
function isSideMenuHidden(){
  try{ return localStorage.getItem(MENU_KEY)==='1'; }catch(e){ return false; }
}
function applySideMenuState(){
  const hidden=isSideMenuHidden();
  const menu=document.getElementById('sideMenu');
  const btn=document.getElementById('menuToggleBtn');
  if(menu)menu.classList.toggle('is-hidden',hidden);
  if(btn)btn.title=hidden?'Tampilkan menu':'Sembunyikan menu';
}
function toggleSideMenu(){
  const hidden=isSideMenuHidden();
  try{ localStorage.setItem(MENU_KEY,hidden?'0':'1'); }catch(e){}
  applySideMenuState();
}
function applySideMenuPanelPosition(){
  const menu=document.getElementById('sideMenu');
  if(!menu)return;
  try{
    const saved=JSON.parse(localStorage.getItem(MENU_POS_KEY)||'null');
    if(saved&&typeof saved.left==='number'&&typeof saved.top==='number'){
      menu.style.left=saved.left+'px';
      menu.style.top=saved.top+'px';
    }
  }catch(e){}
}
let sideMenuDrag=null;
function menuPanelPointerDown(e){
  const menu=document.getElementById('sideMenu');
  if(!menu)return;
  const rect=menu.getBoundingClientRect();
  sideMenuDrag={startX:e.clientX,startY:e.clientY,origLeft:rect.left,origTop:rect.top};
  try{e.target.setPointerCapture(e.pointerId);}catch(err){}
  document.addEventListener('pointermove',menuPanelPointerMove);
  document.addEventListener('pointerup',menuPanelPointerUp);
  e.preventDefault();
}
function menuPanelPointerMove(e){
  if(!sideMenuDrag)return;
  const menu=document.getElementById('sideMenu');
  if(!menu)return;
  const dx=e.clientX-sideMenuDrag.startX,dy=e.clientY-sideMenuDrag.startY;
  let newLeft=sideMenuDrag.origLeft+dx,newTop=sideMenuDrag.origTop+dy;
  newLeft=Math.max(4,Math.min(window.innerWidth-90,newLeft));
  newTop=Math.max(4,Math.min(window.innerHeight-40,newTop));
  menu.style.left=newLeft+'px';
  menu.style.top=newTop+'px';
}
function menuPanelPointerUp(){
  document.removeEventListener('pointermove',menuPanelPointerMove);
  document.removeEventListener('pointerup',menuPanelPointerUp);
  if(sideMenuDrag){
    const menu=document.getElementById('sideMenu');
    if(menu){
      try{ localStorage.setItem(MENU_POS_KEY,JSON.stringify({left:parseFloat(menu.style.left),top:parseFloat(menu.style.top)})); }catch(e){}
    }
  }
  sideMenuDrag=null;
}
applySideMenuPanelPosition();
applySideMenuState();

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const csvTxt=await getText(CSV_URL);
    parseSheet(csvTxt);
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
</body>
</html>
