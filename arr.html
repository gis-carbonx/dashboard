<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#356760;--primary-md:#618273;--primary-lt:#B5BBA9;--primary-bg:#FFFAF3;
  --dark:#3A342C;
  --bg:#FFFAF3;--surface:#fff;--border:#DCDACC;--border-lt:#EDE7D8;
  --text:#1a2332;--text-2:#64748b;--text-3:#a0aec0;
}
html,body{height:100%;overflow:hidden;font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column}

.site-navbar{
  flex-shrink:0;
  height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 32px;background-color:#FFFAF3;border-bottom:1px solid #DCDACC;
}
.site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
.site-navbar-brand img{width:26px;height:26px;object-fit:contain}
.site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:#356760}
.site-navbar-menu{display:flex;gap:32px;justify-self:center}
.site-navbar-menu a{text-decoration:none;color:#618273;font-size:13px;font-weight:500}
.site-navbar-menu a:hover,.site-navbar-menu a.active{color:#356760}
.site-navbar-spacer{justify-self:end}
@media (max-width:768px){
  .site-navbar{grid-template-columns:auto auto;padding:0 16px}
  .site-navbar-menu{gap:14px;justify-self:end}
  .site-navbar-spacer{display:none}
}

.dashboard-frame{flex:1;min-height:0;margin:0 28px 28px 28px;border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.10);background:#fff;overflow:hidden;display:flex;flex-direction:column}

.hero{background:var(--dark);color:#fff;padding:14px 0;flex-shrink:0}
.hero-inner{max-width:1180px;margin:0 auto;padding:0 36px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.2px}
.hero-date{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}

.body-row{flex:1;min-height:0;display:flex}

.page-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable}
.content-row{max-width:1180px;margin:0 auto;padding:28px 36px 48px;display:flex;align-items:flex-start;gap:20px}

.side-menu{position:sticky;top:20px;width:60px;flex-shrink:0;background:var(--dark);border-radius:18px;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.side-item{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;flex-shrink:0;text-decoration:none;color:rgba(255,255,255,.5);cursor:pointer;background:none;border:none;transition:background .15s,color .15s}
.side-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-item:hover{background:rgba(255,255,255,.1);color:#fff}
.side-item.active{background:#fff;color:var(--dark);border-radius:50%}

.page-body-inner{flex:1;min-width:0}

.sec-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:18px}
.sub-title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 14px}
.page-note{font-size:12px;color:var(--text-2);line-height:1.65;margin:16px 0 28px}

.loading-note{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px}

.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.filter-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);min-width:58px}
.fpill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:10.5px;font-weight:600;color:var(--text-2);cursor:pointer;font-family:inherit}
.fpill.active{background:var(--primary);border-color:var(--primary);color:#fff}
.fpill:hover:not(.active){background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-md)}
.filter-select{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:10.5px;font-weight:600;color:var(--text-2);cursor:pointer;outline:none;font-family:inherit}
.filter-select:focus{border-color:var(--primary)}

.grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,260px));gap:16px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px}
.card-lbl{font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:10px}
.card-val-lg{font-size:22px;font-weight:800;color:var(--primary)!important;line-height:1}
.card-sub-pct{font-size:10.5px;color:var(--text-2);font-weight:600;margin-top:5px}
.grid-row{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi-note{max-width:820px;margin:0 0 32px}

:root{--c-agro:#2d7a55;--c-agro-lt:#8fbfa6;--c-temb:#c0611c;--c-temb-lt:#e8b48a;--c-l:#356760;--c-p:#B5BBA9;--shadow-md:0 4px 14px rgba(0,0,0,.08)}
.row-head{margin:4px 0 14px}
.row-title{font-size:14.5px;font-weight:700;color:var(--text)}
.row-desc{font-size:12px;color:var(--text-2);line-height:1.6;margin-top:4px;max-width:760px}
.row-desc a{color:var(--primary);font-weight:600}
.chart-pair{display:grid;grid-template-columns:minmax(260px,1fr) 2.2fr;gap:16px;align-items:stretch;margin-bottom:32px}
.chart-pair.even{grid-template-columns:1fr 1fr}
.chart-pair.wide{grid-template-columns:1.6fr 1fr}
.row-head+.grid-row{margin-bottom:16px}
@media (max-width:980px){.chart-pair,.chart-pair.even,.chart-pair.wide{grid-template-columns:1fr}}

/* Insentif: tahap */
:root{--c-paid:#356760;--c-early:#8C9F8B;--c-unpaid:#EDE7D8}
.st-head,.st-row{display:grid;grid-template-columns:110px 1fr 52px 120px;gap:10px;align-items:center}
.st-head{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);padding:0 4px 4px}
.st-head span:nth-child(n+3){text-align:right}
.st-row{position:relative;padding:4px;border-radius:6px;outline:none}
.st-row:hover,.st-row:focus{background:var(--bg)}
.st-lbl{font-size:12px;color:var(--text);text-align:right}
.st-bar{display:flex;gap:2px;height:14px;border-radius:3px;overflow:hidden;background:var(--c-unpaid)}
.st-pct{font-size:12px;font-weight:700;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.st-nom{font-size:11px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-row .tt-box{left:120px;top:calc(100% - 2px)}
.st-row:hover .tt-box,.st-row:focus .tt-box{display:block}

/* Insentif: tabel */
.ins-card{padding:18px 20px 14px;margin-bottom:32px}
.ins-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ins-hd-r{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;gap:6px}
.seg button{padding:4px 12px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:10.5px;font-weight:600;color:var(--text-2);cursor:pointer;font-family:inherit}
.seg button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.seg button:hover:not(.active){background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-md)}
.dl-wrap{position:relative}
.btn-dl{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-dl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.dl-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);min-width:130px;overflow:hidden}
.dl-wrap.open .dl-menu{display:block}
.dl-menu button{display:block;width:100%;padding:8px 13px;border:none;background:none;text-align:left;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
.dl-menu button:hover{background:var(--primary-bg);color:var(--primary-md)}
.ins-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search-wrap{position:relative;flex:0 1 220px;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:10px;width:12px;height:12px;stroke:var(--text-3);fill:none;stroke-width:2;pointer-events:none}
.search-wrap input{width:100%;padding:5px 10px 5px 28px;border-radius:20px;border:1px solid var(--border);font-size:11px;font-family:inherit;color:var(--text);outline:none}
.search-wrap input:focus{border-color:var(--primary)}
.ins-count{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-2)}
.ins-scroll{max-height:520px;overflow:auto;border-top:1.5px solid var(--text);border-bottom:1.5px solid var(--text)}
.ins-tbl{width:100%;border-collapse:collapse;font-size:11.5px;color:var(--text)}
.ins-tbl thead{position:sticky;top:0;z-index:2;background:#fff}
.ins-tbl th{padding:6px 10px;font-weight:600;text-align:left;white-space:nowrap;border-bottom:1px solid var(--text);vertical-align:bottom}
.ins-tbl .th-group{text-align:center;border-bottom:1px solid var(--border)}
.ins-tbl .th-pct{text-align:center;font-weight:400;color:var(--text-2)}
.ins-tbl .th-pct small{display:block;font-size:10.5px}
.ins-tbl td{padding:5px 10px;border-bottom:1px solid var(--border-lt);white-space:nowrap}
.ins-tbl .c{text-align:center}.ins-tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.ins-tbl .muted{color:var(--text-2)}
.ins-tbl tfoot td{font-weight:600;border-top:1px solid var(--text);border-bottom:none;position:sticky;bottom:0;background:#fff}

/* Tabel ringkas + "Tampilkan semua" */
.clip{position:relative}
.clip.open .ins-scroll{max-height:420px;overflow:auto}
.clip.clipped .ins-scroll{max-height:150px;overflow:hidden}
#insClip.clipped .ins-scroll{max-height:178px}
.clip.clipped .ins-tbl tfoot td{position:static}
.clip.clipped::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 85%)}
.more-btn{display:block;margin:8px auto 0;padding:5px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:600;color:var(--primary);cursor:pointer;font-family:inherit}
.more-btn:hover{background:var(--primary-bg);border-color:var(--primary-md)}

/* Batang per KTH */
.kb-list{display:flex;flex-direction:column;gap:1px;max-height:372px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.kb-row{position:relative;display:grid;grid-template-columns:140px 1fr 72px;gap:10px;align-items:center;padding:4px;border-radius:6px;outline:none}
.kb-row:hover,.kb-row:focus{background:var(--bg)}
.kb-lbl{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-track{height:12px}
.kb-track.bg{background:var(--border-lt);border-radius:3px;overflow:hidden}
.kb-bar{display:flex;gap:2px;height:100%;border-radius:0 3px 3px 0;overflow:hidden;min-width:2px}
.kb-val{font-size:11px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kb-val.b{font-size:12px;font-weight:700;color:var(--text)}
/* fixed agar tidak terpotong .kb-list */
.kb-row .tt-box{position:fixed;z-index:50}
.kb-row:hover .tt-box,.kb-row:focus .tt-box{display:block}
@media (max-width:640px){.kb-row{grid-template-columns:96px 1fr 60px;gap:8px}}
@media (max-width:640px){.st-head,.st-row{grid-template-columns:84px 1fr 44px 92px;gap:6px}.st-row .tt-box{left:8px;right:8px;min-width:0}}
.chart-card{padding:18px 20px 16px;min-width:0;display:flex;flex-direction:column}
.chart-title{font-size:13px;font-weight:700;color:var(--text)}
.chart-sub{font-size:11px;color:var(--text-2);margin:3px 0 16px}
.chart-foot{font-size:10.5px;color:var(--text-3);margin-top:12px}
.empty{padding:40px 10px;text-align:center;color:var(--text-3);font-size:12px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:-6px 0 14px}
.lg-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2)}
.lg-item i,.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0}
.lg-item i.ln{height:2px;width:14px;border-radius:1px}

/* Capaian target */
.tg-list{display:flex;flex-direction:column;gap:16px}
.tg-row.main{padding-bottom:14px;border-bottom:1px solid var(--border-lt)}
.tg-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.tg-name{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.tg-val{font-size:15px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.tg-row.main .tg-val{font-size:18px}
.tg-track{position:relative;height:10px;background:var(--border-lt);border-radius:3px;overflow:hidden}
.tg-bar{height:100%;border-radius:3px}
.tg-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-2);margin-top:5px;font-variant-numeric:tabular-nums}
.tg-meta b{color:var(--text);font-weight:700}

/* Sub program */
.sp-group{margin-bottom:14px}
.sp-group:last-child{margin-bottom:0}
.sp-ghd{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--text);padding:0 0 6px;border-bottom:1px solid var(--border-lt);margin-bottom:6px}
.sp-ghd span:first-child{display:flex;align-items:center;gap:6px}
.sp-row{position:relative;display:grid;grid-template-columns:150px 1fr 76px 64px;gap:10px;align-items:center;padding:5px 4px;border-radius:6px;outline:none}
.sp-row:hover,.sp-row:focus{background:var(--bg)}
.sp-lbl{font-size:12px;color:var(--text)}
.sp-track{height:12px}
.sp-bar{height:100%;border-radius:0 3px 3px 0;min-width:2px}
.sp-val{font-size:12px;font-weight:700;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.sp-n{font-size:11px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums}

/* Tooltip */
.tt-box{display:none;position:absolute;z-index:6;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:10px 12px;pointer-events:none;min-width:200px}
.tt-head{font-size:11.5px;color:var(--text-2);margin-bottom:6px}
.tt-head strong{color:var(--text);font-weight:700}
.tt-row{display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--text-2);padding:2px 0;font-variant-numeric:tabular-nums}
.tt-row b{color:var(--text)}
.tt-row .sw{margin-right:6px;vertical-align:-1px}
.sp-row .tt-box{left:150px;top:calc(100% - 2px)}
.sp-row:hover .tt-box,.sp-row:focus .tt-box{display:block}

/* Donut petani */
.donut-wrap{display:flex;justify-content:center;margin:2px 0 14px}
.donut{width:160px;height:160px;overflow:visible}
.donut circle.seg{fill:none;stroke-width:26}
.donut-c1{font-size:22px;font-weight:800;fill:var(--text)}
.donut-c2{font-size:10px;fill:var(--text-2)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--text);padding:4px 2px}
.kv span:first-child{display:flex;align-items:center;gap:8px}
.kv b{font-variant-numeric:tabular-nums}
.kv small{font-size:10.5px;color:var(--text-2);font-weight:600;margin-left:6px}
.kv-sep{border-top:1px solid var(--border-lt);margin:8px 0 6px;padding-top:8px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3)}

/* Bar bulanan */
.bc-plot{flex:1;min-height:240px;display:grid;grid-template-columns:44px 1fr;grid-template-rows:1fr auto;column-gap:8px;margin-top:4px}
.bc-yaxis{position:relative}
.bc-yaxis span{position:absolute;right:0;transform:translateY(50%);font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bc-area{position:relative;display:grid;gap:6px;padding:0 4px;border-bottom:1px solid var(--border)}
.bc-grid{position:absolute;left:0;right:0;border-top:1px solid var(--border-lt);pointer-events:none}
.bc-col{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;outline:none;border-radius:4px 4px 0 0}
.bc-col:hover,.bc-col:focus{background:rgba(53,103,96,.06)}
.bc-bar{width:42%;max-width:18px;border-radius:4px 4px 0 0;min-height:0}
.bc-xl{display:grid;gap:6px;padding:6px 4px 0}
.bc-xl span{font-size:10.5px;color:var(--text-2);text-align:center;white-space:nowrap}
.bc-col .tt-box{bottom:calc(100% + 6px);left:50%;transform:translateX(-50%)}
.bc-col:nth-of-type(-n+3) .tt-box{left:0;transform:none}
.bc-col:nth-last-of-type(-n+3) .tt-box{left:auto;right:0;transform:none}
.bc-col:hover .tt-box,.bc-col:focus .tt-box{display:block}

/* Garis kumulatif */
.pl-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pl-item{background:var(--bg);border-radius:10px;padding:10px 12px}
.pl-name{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text)}
.pl-val{font-size:15px;font-weight:800;color:var(--text);margin-top:6px;font-variant-numeric:tabular-nums}
.pl-val small{font-size:11px;font-weight:600;color:var(--text-2)}
.pl-sub{font-size:10.5px;color:var(--text-2);margin-top:3px;line-height:1.4}
.lc{position:relative;flex:1;min-height:230px}
.lc svg{display:block;width:100%;height:100%}
.lc .tt-box{top:8px}

/* Jenis tanaman */
.sl{display:flex;flex-direction:column;gap:1px;max-height:372px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.sl-row{display:grid;grid-template-columns:130px 1fr 60px 46px;gap:10px;align-items:center;padding:4px 4px;border-radius:6px}
.sl-row:hover{background:var(--bg)}
.sl-lbl{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-track{height:12px}
.sl-bar{height:100%;background:var(--primary);border-radius:0 3px 3px 0;min-width:2px}
.sl-val{font-size:11px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums}
.sl-pct{font-size:12px;font-weight:700;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .sp-row{grid-template-columns:110px 1fr 66px 52px;gap:8px}
  .sp-row .tt-box{left:8px;right:8px;min-width:0}
  .sl-row{grid-template-columns:96px 1fr 52px 42px;gap:8px}
  .pl-strip{grid-template-columns:1fr}
}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="hero">
    <div class="hero-inner">

<script>
'use strict';
const SHEET_ID='1-LHCIUy1iD154WczY4Da_-iRaILtvL0mOW4gRW6YQac',SHEET_NAME='ARR_SUMMARY',TARGET_NAME='TARGET_CAPAIAN';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
const TARGET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TARGET_NAME)}`;

const str=v=>(v??'').toString().trim();
const num=v=>parseFloat(str(v))||0;
const fmt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtPct=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseDate(s){
  if(!s)return null;const c=str(s);
  const m=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  const d=new Date(c);return isNaN(d)?null:d;
}
function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
function colV(raw,keys,names,idx){
  const v=pickCI(raw,keys,...names);
  if(v!==undefined)return v;
  return idx!=null&&keys[idx]!==undefined?raw[keys[idx]]:undefined;
}
function resolveProgram(aReg,aBPO,tReg,tMTL,tipe){
  if(aReg>0)return'Agro_Reg';if(aBPO>0)return'Agro_BPO';
  if(tReg>0)return'Temb_Reg';if(tMTL>0)return'Temb_MTL';
  const t=tipe.toLowerCase();
  return t.includes('tembawang')?'Temb_Reg':t.includes('agro')?'Agro_Reg':null;
}
async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

let rows=[],targetData={},years=[];

// Tahap insentif reguler
const INS_STAGES=[
  {key:'persiapan',label:'Persiapan Lahan',idx:17},
  {key:'tanam',    label:'Penanaman',      idx:18},
  {key:'thn2',     label:'Tahun 2',        idx:19},
  {key:'thn3',     label:'Tahun 3',        idx:20},
  {key:'thn4',     label:'Tahun 4',        idx:21},
  {key:'thn6',     label:'Tahun 6',        idx:22},
  {key:'thn7',     label:'Tahun 7',        idx:23},
  {key:'thn8',     label:'Tahun 8',        idx:24},
  {key:'thn9',     label:'Tahun 9',        idx:25},
  {key:'thn10',    label:'Tahun 10',       idx:26},
];
const PROG_LABEL={Agro_Reg:'Agroforestri Reguler',Agro_BPO:'Bantuan Pupuk Organik',Temb_Reg:'Reforestasi Reguler',Temb_MTL:'Menjaga Tutupan Lahan'};
// Y = dibayar, R = dibayar di awal
const stageStatus=v=>/^y$/i.test(str(v))?'paid':/^r$/i.test(str(v))?'early':'unpaid';
const stageLabel=v=>({paid:'Sudah Bayar',early:'Dibayar Diawal',unpaid:'Belum Bayar'})[stageStatus(v)];
const stageText=v=>({paid:'Sudah',early:'Selesai',unpaid:'Belum'})[stageStatus(v)];
const fmtRp=v=>'Rp '+fmtInt(v);
const fmtDate=s=>{const d=parseDate(s);return d?d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):str(s);};

function parseSheet(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  rows=[];
  // Kolom "P-<jenis>" = tanaman program
  const plantCols=[];
  (data.length?Object.keys(data[0]):[]).forEach(h=>{const m=h.match(/^P-\s*(.+)$/i);if(m)plantCols.push({header:h,name:m[1].trim()});});
  data.forEach(raw=>{
    const id=str(raw['ID_Petak']||raw['id_petak']||raw['ID Petak']||'');if(!id)return;
    const keys=Object.keys(raw);
    const kth=str(raw['KTH']||''),tipe=str(raw['Tipe']||''),petani=str(raw['Petani']||''),jk=str(raw['Jenis Kelamin']||raw['Jenis_Kelamin']||'');
    const tglPartisipasi=str(raw['Tgl_Partisipasi']||raw['Tgl Partisipasi']||'');
    const tglRealisasi=str(raw['Tgl_Realisasi']||raw['Tgl Realisasi']||'');
    const aReg=num(raw['Agro_Reg']||raw['Agro Reg']||0),aBPO=num(raw['Agro_BPO']||raw['Agro BPO']||0);
    const tReg=num(raw['Temb_Reg']||raw['Temb Reg']||0),tMTL=num(raw['Temb_MTL']||raw['Temb MTL']||0);
    const luasAgroAT=num(colV(raw,keys,['luas_agro','Luas_Agro'],45));
    const luasTembAU=num(colV(raw,keys,['luas_temb','Luas_Temb'],46));
    const prog=resolveProgram(aReg,aBPO,tReg,tMTL,tipe);
    if(!prog)return; // enrichment tidak dihitung
    const jumlahTanaman=num(colV(raw,keys,['Total_Tanaman','Total Tanaman','Jumlah_Tanaman'],49));
    const plantedPlants=plantCols.map(c=>({name:c.name,count:num(raw[c.header])})).filter(p=>p.count>0);
    const nominalStages={},stages={};
    INS_STAGES.forEach((s,i)=>{
      nominalStages[s.key]=num(colV(raw,keys,['Nominal_T'+(i+1)],28+i));
      const hv=pickCI(raw,keys,'Insentif_T'+(i+1));
      const byName=hv!==undefined?str(hv):str(raw[s.key]||raw[s.label]||'');
      stages[s.key]=byName||(hv===undefined&&keys[s.idx]?str(raw[keys[s.idx]]):'');
    });
    const luasAgro=luasAgroAT>0?luasAgroAT:aReg+aBPO,luasTemb=luasTembAU>0?luasTembAU:tReg+tMTL;
    rows.push({id,kth,petani,jk,prog,
      desa:str(raw['Desa']||''),dusun:str(colV(raw,keys,['dusun'],44)),
      tglPartisipasi:parseDate(tglPartisipasi),tglRealisasi:parseDate(tglRealisasi),
      luasAgroAT,luasTembAU,aReg,aBPO,tReg,tMTL,jumlahTanaman,plantedPlants,
      // fallback ke kolom sub program
      luasAgro,luasTemb,luas:luasAgro+luasTemb,
      nominalStages,stages,
      pupukPadat:num(colV(raw,keys,['PupukPadat','Pupuk_Padat'],39)),
      pupukCair:num(colV(raw,keys,['PupukCair','Pupuk_Cair'],40)),
      tglBPO:str(colV(raw,keys,['tanggal_bpo','Tgl_BPO'],41)),
      insentifMTL:num(colV(raw,keys,['insentifMTL','Insentif_MTL'],42)),
      tglMTL:str(colV(raw,keys,['tanggal_mtl','Tgl_MTL'],43))});
  });
}

// TARGET_CAPAIAN: A uraian, B target utama, C tahun, D–O target Jan–Des, P target tahunan
function parseTargetSheet(csv){
  const {data}=Papa.parse(csv,{header:false,skipEmptyLines:true});
  targetData={};
  data.forEach((row,i)=>{
    if(!i)return;
    const uraian=str(row[0]).toLowerCase(),tahun=parseInt(str(row[2]));
    if(!uraian||isNaN(tahun)||tahun<2000)return;
    const isA=uraian.includes('agro')&&!uraian.includes('bpo');
    const isT=uraian==='tembawang';
    if(!isA&&!isT)return;
    if(!targetData[tahun])targetData[tahun]={agro_utama:0,temb_utama:0,agro_total:0,temb_total:0,monthly:Array.from({length:12},()=>({agro:0,temb:0}))};
    const td=targetData[tahun];
    const utama=parseFloat(str(row[1]))||0,total=parseFloat(str(row[15]))||0;
    if(isA){td.agro_utama+=utama;td.agro_total+=total;}
    if(isT){td.temb_utama+=utama;td.temb_total+=total;}
    for(let m=0;m<12;m++){
      const v=parseFloat(str(row[3+m]))||0;
      if(isA)td.monthly[m].agro+=v;else td.monthly[m].temb+=v;
    }
  });
}

// 'yq' = Tahun + Quarter; 'ytd'/'mtd'/'week' mengabaikan keduanya
const QUARTERS=['1','2','3','4'];
let currentYear='all',currentQuarter='all',periodMode='yq';
let weekYear=new Date().getFullYear(),weekMonth=new Date().getMonth(),weekIdx=null;

// Minggu = Sabtu–Jumat
function getWeeksInMonth(yr,mo){
  let sat=new Date(yr,mo,1);sat.setDate(sat.getDate()-((sat.getDay()+1)%7));
  const last=new Date(yr,mo+1,0),weeks=[];let n=1;
  while(sat<=last){const fri=new Date(sat);fri.setDate(fri.getDate()+6);fri.setHours(23,59,59);weeks.push({sat:new Date(sat),fri,label:`Minggu ke-${n++}`});sat.setDate(sat.getDate()+7);}
  return weeks;
}
function fmtD(d,t){return d.toLocaleDateString('id-ID',t==='s'?{day:'numeric',month:'short'}:{day:'numeric',month:'long',year:'numeric'});}
function defaultWeekIdx(){
  const now=new Date();let best=0;
  getWeeksInMonth(weekYear,weekMonth).forEach((w,i)=>{if(w.sat<=now&&now<=w.fri)best=i;});
  return best;
}
function getSelectedWeek(){
  const weeks=getWeeksInMonth(weekYear,weekMonth);
  return weeks[weekIdx??defaultWeekIdx()]||weeks[0]||null;
}

function inPeriod(d){
  if(!d)return false;
  const now=new Date();
  if(periodMode==='ytd')return d.getFullYear()===now.getFullYear()&&d<=now;
  if(periodMode==='mtd')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d<=now;
  if(periodMode==='week'){const wk=getSelectedWeek();return !!wk&&d>=wk.sat&&d<=wk.fri;}
  if(currentYear!=='all'&&d.getFullYear()!==+currentYear)return false;
  if(currentQuarter!=='all'&&Math.floor(d.getMonth()/3)+1!==+currentQuarter)return false;
  return true;
}
// Target sesuai periode: tahunan (Tahun/YTD), jumlah 3 bulan (Quarter), bulanan (MTD/Mingguan)
function targetScope(){
  const now=new Date();
  if(periodMode==='ytd')return{year:now.getFullYear(),months:null,label:`Target ${now.getFullYear()}`};
  if(periodMode==='mtd')return{year:now.getFullYear(),months:[now.getMonth()],label:`Target ${MN[now.getMonth()]} ${now.getFullYear()}`};
  if(periodMode==='week'){
    const wk=getSelectedWeek();if(!wk)return null;
    const y=wk.fri.getFullYear(),m=wk.fri.getMonth();
    return{year:y,months:[m],label:`Target ${MN[m]} ${y}`};
  }
  if(currentYear==='all')return{year:null,months:null,label:'Target sepanjang program'};
  const y=+currentYear;
  if(currentQuarter==='all')return{year:y,months:null,label:`Target ${y}`};
  const q0=(+currentQuarter-1)*3;
  return{year:y,months:[q0,q0+1,q0+2],label:`Target Q${currentQuarter} ${y}`};
}
function getTarget(){
  const sc=targetScope();if(!sc)return null;
  if(sc.year===null){
    const tds=Object.values(targetData);
    return tds.length?{agro:tds.reduce((s,t)=>s+t.agro_utama,0),temb:tds.reduce((s,t)=>s+t.temb_utama,0)}:null;
  }
  const td=targetData[sc.year];if(!td)return null;
  if(!sc.months)return{agro:td.agro_total,temb:td.temb_total};
  return sc.months.reduce((o,m)=>({agro:o.agro+td.monthly[m].agro,temb:o.temb+td.monthly[m].temb}),{agro:0,temb:0});
}
// Mingguan: capaian = akumulasi bulan berjalan s/d akhir minggu (dibanding target bulanan)
function targetBase(rA,rT){
  if(periodMode!=='week')return{a:rA,t:rT,acc:false};
  const wk=getSelectedWeek();if(!wk)return{a:rA,t:rT,acc:false};
  const y=wk.fri.getFullYear(),m=wk.fri.getMonth();
  let a=0,t=0;
  rows.forEach(r=>{const d=r.tglPartisipasi;if(d&&d.getFullYear()===y&&d.getMonth()===m&&d<=wk.fri){a+=r.luasAgroAT;t+=r.luasTembAU;}});
  return{a,t,acc:true,month:MN[m]};
}

function compute(){
  let rA=0,rT=0,dA=0,dT=0,tanA=0,tanT=0,lahan=0;
  let aReg=0,aBPO=0,tReg=0,tMTL=0;
  const petani=new Set(),laki=new Set(),pmp=new Set();
  const pAR=new Set(),pAB=new Set(),pTR=new Set(),pTM=new Set();
  const speciesMap={};
  rows.forEach(r=>{
    // terdaftar: Tgl_Partisipasi
    if(inPeriod(r.tglPartisipasi)){
      lahan++;
      rA+=r.luasAgroAT;rT+=r.luasTembAU;
      aReg+=r.aReg;aBPO+=r.aBPO;tReg+=r.tReg;tMTL+=r.tMTL;
      if(r.petani){
        const k=r.petani.toLowerCase();
        if(r.jk){
          const jk=r.jk.toLowerCase();
          petani.add(k);
          if(jk.includes('laki'))laki.add(k);else if(jk.includes('perempuan'))pmp.add(k);
        }
        if(r.aReg>0)pAR.add(k);if(r.aBPO>0)pAB.add(k);if(r.tReg>0)pTR.add(k);if(r.tMTL>0)pTM.add(k);
      }
    }
    // ditanam: Tgl_Realisasi
    if(inPeriod(r.tglRealisasi)){
      if(r.prog.startsWith('Agro')){dA+=r.luasAgro;tanA+=r.jumlahTanaman;}
      else{dT+=r.luasTemb;tanT+=r.jumlahTanaman;}
      r.plantedPlants.forEach(p=>{speciesMap[p.name]=(speciesMap[p.name]||0)+p.count;});
    }
  });
  const tgt=getTarget();
  const target=tgt?tgt.agro+tgt.temb:null;
  const real=rA+rT,ditanam=dA+dT,base=targetBase(rA,rT);
  return{tgt,target,base,real,rA,rT,ditanam,dA,dT,lahan,
    tanaman:tanA+tanT,tanA,tanT,
    sub:{aReg,aBPO,tReg,tMTL},
    subPetani:{aReg:pAR.size,aBPO:pAB.size,tReg:pTR.size,tMTL:pTM.size},
    species:Object.entries(speciesMap).sort((a,b)=>b[1]-a[1]),
    pct:target>0?(base.a+base.t)/target*100:null,
    petani:petani.size,laki:laki.size,pmp:pmp.size};
}

function setFilter(y){currentYear=y;periodMode='yq';render();}
function setQuarter(q){currentQuarter=q;periodMode='yq';render();}
function setPeriod(p){periodMode=p;render();}
function setWeekYear(v){weekYear=+v;weekIdx=null;render();}
function setWeekMonth(v){weekMonth=+v;weekIdx=null;render();}
function setWeekPick(v){weekIdx=+v;render();}

const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pctOf=(v,t)=>t>0?v/t*100:null;
const fmtHaShort=v=>v>=1000?fmtInt(v/1000)+'rb':(+v||0).toLocaleString('id-ID',{maximumFractionDigits:1});
const isAllTime=()=>periodMode==='yq'&&currentYear==='all'&&currentQuarter==='all';
function periodLabel(){
  const now=new Date();
  if(periodMode==='ytd')return`1 Januari–${fmtD(now,'l')}`;
  if(periodMode==='mtd')return`1–${fmtD(now,'l')}`;
  if(periodMode==='week'){const wk=getSelectedWeek();return wk?`${fmtD(wk.sat,'s')}–${fmtD(wk.fri,'l')}`:'Mingguan';}
  const y=currentYear==='all'?'semua tahun':String(currentYear);
  if(currentQuarter!=='all')return`Q${currentQuarter} ${y}`;
  return currentYear==='all'?'Sepanjang waktu':`Tahun ${y}`;
}
const targetLabel=()=>targetScope()?.label||'Target';
function niceScale(max,n=4){
  if(!(max>0))return{max:1,ticks:[0,1]};
  const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,5,10].map(m=>m*p).find(s=>s>=raw);
  const top=Math.ceil(max/step)*step,ticks=[];
  for(let v=0;v<=top+step/2;v+=step)ticks.push(+v.toFixed(6));
  return{max:top,ticks};
}
// Rentang data (tanggal partisipasi/realisasi paling awal s.d. bulan ini), dihitung sekali lalu disimpan
let _span=null;
function dataSpan(){
  if(_span&&_span.n===rows.length)return _span;
  let min=null;
  rows.forEach(r=>[r.tglPartisipasi,r.tglRealisasi].forEach(d=>{if(d&&(!min||d<min))min=d;}));
  const now=new Date();
  _span={n:rows.length,start:min,months:min?(now.getFullYear()-min.getFullYear())*12+now.getMonth()-min.getMonth()+1:0};
  return _span;
}
// Filter "All": interval menyesuaikan panjang data agar grafik tidak terlalu jarang/padat (maks ±24 titik):
// ≤ 2 tahun per bulan, ≤ 6 tahun per kuartal, selebihnya per tahun
function bucketUnit(){
  if(periodMode==='mtd'||periodMode==='week')return'hari';
  if(periodMode==='yq'&&currentYear==='all'){
    const m=dataSpan().months;
    return m<=24?'bulan':m<=72?'kuartal':'tahun';
  }
  return'bulan';
}
function timeBuckets(){
  const now=new Date(),unit=bucketUnit(),out=[];
  if(periodMode==='yq'&&currentYear==='all'){
    const s=dataSpan().start;
    if(!s)return[];
    const yy=y=>`'${String(y).slice(2)}`;
    if(unit==='tahun'){
      for(let y=s.getFullYear();y<=now.getFullYear();y++)out.push({label:String(y),full:`Tahun ${y}`,start:new Date(y,0,1),end:new Date(y,11,31,23,59,59)});
    }else if(unit==='kuartal'){
      for(let y=s.getFullYear(),q=Math.floor(s.getMonth()/3);y<now.getFullYear()||(y===now.getFullYear()&&q<=Math.floor(now.getMonth()/3));q===3?(q=0,y++):q++)
        out.push({label:`Q${q+1} ${yy(y)}`,full:`Kuartal ${q+1} ${y}`,start:new Date(y,q*3,1),end:new Date(y,q*3+3,0,23,59,59)});
    }else{
      for(let y=s.getFullYear(),m=s.getMonth();y<now.getFullYear()||(y===now.getFullYear()&&m<=now.getMonth());m===11?(m=0,y++):m++)
        out.push({label:`${MN[m].slice(0,3)} ${yy(y)}`,full:`${MN[m]} ${y}`,start:new Date(y,m,1),end:new Date(y,m+1,0,23,59,59)});
    }
    return out;
  }
  if(unit==='hari'){
    let start,end;
    if(periodMode==='mtd'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth(),now.getDate());}
    else{const wk=getSelectedWeek();if(!wk)return[];start=new Date(wk.sat);end=new Date(wk.fri.getFullYear(),wk.fri.getMonth(),wk.fri.getDate());}
    for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1))
      out.push({label:fmtD(d,'s'),full:fmtD(d,'l'),start:new Date(d),end:new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59)});
    return out;
  }
  const yr=periodMode==='ytd'?now.getFullYear():+currentYear;
  let firstM=0,lastM=11;
  if(periodMode==='yq'&&currentQuarter!=='all'){firstM=(+currentQuarter-1)*3;lastM=firstM+2;}
  if(yr===now.getFullYear())lastM=Math.min(lastM,now.getMonth());
  for(let m=firstM;m<=lastM;m++)out.push({label:MN[m].slice(0,3),full:`${MN[m]} ${yr}`,start:new Date(yr,m,1),end:new Date(yr,m+1,0,23,59,59)});
  return out;
}

function targetCardHTML(s){
  const item=(cls,name,color,val,base,tgtVal)=>{
    const p=pctOf(base,tgtVal);
    return`

let lcData=null;
// Kumulatif efisien: tanggal diurutkan sekali, lalu dijumlahkan sambil berjalan per titik waktu
function cumulativeSeries(){
  const bk=timeBuckets();
  const luas=r=>r.prog.startsWith('Agro')?r.luasAgro:r.luasTemb;
  const sorted=k=>rows.filter(r=>r[k]).map(r=>[r[k],luas(r)]).sort((a,b)=>a[0]-b[0]);
  const P=sorted('tglPartisipasi'),R=sorted('tglRealisasi');
  let ip=0,ir=0,reg=0,tan=0;
  return bk.map(b=>{
    while(ip<P.length&&P[ip][0]<=b.end)reg+=P[ip++][1];
    while(ir<R.length&&R[ir][0]<=b.end)tan+=R[ir++][1];
    return{...b,reg,tan};
  });
}
function plantingCardHTML(s){
  lcData=cumulativeSeries();

      </div>

}
function drawLine(){
  const el=document.getElementById('lineChart');
  if(!el||!lcData||!lcData.length)return;
  const W=el.clientWidth,H=el.clientHeight||230;
  const pl=52,pr=12,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const sc=niceScale(Math.max(...lcData.map(d=>Math.max(d.reg,d.tan))));
  const n=lcData.length,step=n>1?iw/(n-1):0;
  const x=i=>pl+(n>1?i*step:iw/2),y=v=>pt+ih-(v/sc.max)*ih;
  const path=k=>lcData.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join('');
  const area=k=>`${path(k)}L${x(n-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
  const every=Math.ceil(n/(W<480?6:12));
  el.innerHTML=`
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik kumulatif luas terdaftar dan luas sudah ditanam">
      ${sc.ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border-lt)"/>
        <text x="${pl-8}" y="${y(t)+3}" text-anchor="end" font-size="10" fill="var(--text-3)">${fmtHaShort(t)} ha</text>`).join('')}
      ${lcData.map((d,i)=>i%every===0||i===n-1?`<text x="${x(i)}" y="${H-6}" text-anchor="${n>1&&i===n-1?'end':n>1&&i===0?'start':'middle'}" font-size="10.5" fill="var(--text-2)">${d.label}</text>`:'').join('')}
      <path d="${area('reg')}" fill="var(--text-3)" opacity=".10"/>
      <path d="${area('tan')}" fill="var(--primary)" opacity=".14"/>
      <path d="${path('reg')}" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${path('tan')}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>
      <line id="lcCross" y1="${pt}" y2="${pt+ih}" stroke="var(--text-2)" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="lcDotR" r="4" fill="var(--text-3)" stroke="#fff" stroke-width="2" visibility="hidden"/>
      <circle id="lcDotT" r="4" fill="var(--primary)" stroke="#fff" stroke-width="2" visibility="hidden"/>
      <rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent" id="lcHit"/>
    </svg>
    <div class="tt-box" id="lcTip"></div>`;
  const hit=el.querySelector('#lcHit'),tip=el.querySelector('#lcTip');
  const cross=el.querySelector('#lcCross'),dR=el.querySelector('#lcDotR'),dT=el.querySelector('#lcDotT');
  const show=i=>{
    const d=lcData[i],cx=x(i);
    [cross,dR,dT].forEach(e=>e.setAttribute('visibility','visible'));
    cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);
    dR.setAttribute('cx',cx);dR.setAttribute('cy',y(d.reg));
    dT.setAttribute('cx',cx);dT.setAttribute('cy',y(d.tan));
    tip.innerHTML=`<div class="tt-head"><strong>${d.full}</strong></div>
      <div class="tt-row"><span><i class="sw" style="background:var(--text-3)"></i>Terdaftar</span><span>${fmt(d.reg)} ha</span></div>
      <div class="tt-row"><span><i class="sw" style="background:var(--primary)"></i>Sudah ditanam</span><span>${fmt(d.tan)} ha</span></div>
      <div class="tt-row"><span>Persentase ditanam</span><b>${d.reg>0?fmtPct(d.tan/d.reg*100):'0,0'}%</b></div>`;
    tip.style.display='block';
    const left=cx+14+tip.offsetWidth>W?cx-14-tip.offsetWidth:cx+14;
    tip.style.left=Math.max(0,left)+'px';
  };
  const hide=()=>{[cross,dR,dT].forEach(e=>e.setAttribute('visibility','hidden'));tip.style.display='none';};
  hit.addEventListener('mousemove',ev=>{
    const bx=ev.clientX-el.getBoundingClientRect().left;
    show(n>1?Math.max(0,Math.min(n-1,Math.round((bx-pl)/step))):0);
  });
  hit.addEventListener('mouseleave',hide);
}

function insSummary(){
  const reg=insRegRows(),thn=insThnRows();
  let regPaid=0;
  reg.forEach(r=>INS_STAGES.forEach(s=>{if(stageStatus(r.stages[s.key])!=='unpaid')regPaid+=r.nominalStages[s.key]||0;}));
  const bpo=thn.filter(hasBPO),mtl=thn.filter(hasMTL);
  const sum=(l,f)=>l.reduce((a,r)=>a+f(r),0);
  return{reg:reg.length,regPaid,
    bpo:bpo.length,bpoPaid:bpo.filter(r=>r.tglBPO).length,
    cair:sum(bpo,r=>r.pupukCair),cairPaid:sum(bpo.filter(r=>r.tglBPO),r=>r.pupukCair),
    padat:sum(bpo,r=>r.pupukPadat),padatPaid:sum(bpo.filter(r=>r.tglBPO),r=>r.pupukPadat),
    mtl:mtl.length,mtlPaidN:mtl.filter(r=>r.tglMTL).length,
    mtlAll:sum(mtl,r=>r.insentifMTL),mtlPaid:sum(mtl.filter(r=>r.tglMTL),r=>r.insentifMTL)};
}

function updateInsTable(){
  const vis=insVisibleRows(),reg=insState.view==='reguler';

  let thead,tbody;
  if(reg){
    const sub=INS_STAGES.map(s=>{
      const done=vis.filter(r=>stageStatus(r.stages[s.key])!=='unpaid');
      const v=insState.nominal?(()=>{const t=done.reduce((a,r)=>a+(r.nominalStages[s.key]||0),0);return t>0?fmtRp(t):'—';})()
        :vis.length?Math.round(done.length/vis.length*100)+'%':'—';
      return`<th class="th-pct">${v}</th>`;
    }).join('');
    thead=`<tr>${[...head,'Thn Bergabung'].map(h=>`<th rowspan="2">${h}</th>`).join('')}${INS_STAGES.map(s=>`<th class="th-group">${s.label}</th>`).join('')}</tr><tr>${sub}</tr>`;
    tbody=vis.map((r,i)=>`<tr><td class="r">${i+1}</td><td>${esc(r.id)}</td><td>${esc(r.petani)}</td><td>${esc(r.desa)||'—'}</td><td>${esc(r.dusun)||'—'}</td><td>${tag(r.prog)}</td><td class="r">${fmt(r.luas)}</td><td class="c">${yr(r)}</td>
      ${INS_STAGES.map(s=>{
        const st=stageStatus(r.stages[s.key]);
        if(!insState.nominal)return`<td class="c${st==='paid'?'':' muted'}">${stageText(r.stages[s.key])}</td>`;
        if(st==='unpaid')return'<td class="c muted">—</td>';
        const nom=r.nominalStages[s.key]||0;
        return`<td class="r${st==='early'?' muted':''}">${nom>0?fmtRp(nom):st==='early'?'Selesai':'Sudah'}</td>`;
      }).join('')}</tr>`).join('');
  }else{
    const sum=(l,f)=>l.reduce((a,r)=>a+f(r),0);
    const bpo=vis.filter(hasBPO),mtl=vis.filter(hasMTL);
    const tot=(all,paid,f,u)=>all>0?`${f(all)}${u}<small>${paid>0?(paid<all?`dibagikan ${f(paid)}${u}`:'semua dibagikan'):''}</small>`:'—';
    const cair=sum(bpo,r=>r.pupukCair),padat=sum(bpo,r=>r.pupukPadat),mtlAll=sum(mtl,r=>r.insentifMTL),mtlPaid=sum(mtl.filter(r=>r.tglMTL),r=>r.insentifMTL);
    thead=`<tr>${head.map(h=>`<th rowspan="2">${h}</th>`).join('')}<th class="th-group">Pupuk Cair (L)</th><th class="th-group">Pupuk Padat (kg)</th><th class="th-group">Status BPO</th><th class="th-group">Insentif MTL (Rp)</th><th class="th-group">Status MTL</th></tr>
      <tr><th class="th-pct r">${tot(cair,sum(bpo.filter(r=>r.tglBPO),r=>r.pupukCair),fmt,' L')}</th><th class="th-pct r">${tot(padat,sum(bpo.filter(r=>r.tglBPO),r=>r.pupukPadat),fmt,' kg')}</th><th class="th-pct">—</th>
      <th class="th-pct r">${mtlAll>0?`${fmtRp(mtlAll)}<small>${mtlPaid>0?(mtlPaid<mtlAll?`dibayar ${fmtRp(mtlPaid)}`:'lunas'):''}</small>`:'—'}</th><th class="th-pct">—</th></tr>`;
    const status=(has,tgl)=>has?(tgl?`Sudah (${fmtDate(tgl)})`:'Belum'):'—';
    tbody=vis.map((r,i)=>`<tr><td class="r">${i+1}</td><td>${esc(r.id)}</td><td>${esc(r.petani)}</td><td>${esc(r.desa)||'—'}</td><td>${esc(r.dusun)||'—'}</td><td>${tag(r.prog)}</td><td class="r">${fmt(r.luas)}</td>
      <td class="r">${r.pupukCair>0?fmt(r.pupukCair):'—'}</td><td class="r">${r.pupukPadat>0?fmt(r.pupukPadat):'—'}</td><td>${status(hasBPO(r),r.tglBPO)}</td>
      <td class="r">${r.insentifMTL>0?fmtInt(r.insentifMTL):'—'}</td><td>${status(hasMTL(r),r.tglMTL)}</td></tr>`).join('');
  }
  document.getElementById('insThead').innerHTML=thead;
  document.getElementById('insTbody').innerHTML=tbody;
  document.getElementById('insEmpty').style.display=vis.length?'none':'block';
  document.getElementById('insCount').textContent=`${fmtInt(vis.length)} lahan`;
  applyClip('ins',vis.length,insState.open);
}

function insExportData(raw){

  const n2=v=>raw?+v.toFixed(2):v.toLocaleString('id-ID',{minimumFractionDigits:2});
  const rp=v=>raw?Math.round(v):fmtInt(v);
  const base=r=>[r.id,r.petani,r.desa,r.dusun||'',PROG_LABEL[r.prog],luas(r)];
  if(reg)return{reg,vis,
    hdr:['No','ID Lahan','Nama Petani','Desa','Dusun','Program','Luas (ha)','Tahun Bergabung',...INS_STAGES.flatMap(s=>[s.label,'Nominal '+s.label])],
    body:vis.map((r,i)=>[i+1,...base(r),yr(r),...INS_STAGES.flatMap(s=>[stageLabel(r.stages[s.key]),
      stageStatus(r.stages[s.key])!=='unpaid'&&r.nominalStages[s.key]?rp(r.nominalStages[s.key]):''])])};
  return{reg,vis,
    hdr:['No','ID Lahan','Nama Petani','Desa','Dusun','Program','Luas (ha)','Pupuk Cair (L)','Pupuk Padat (kg)','Status BPO','Tgl BPO','Insentif MTL (Rp)','Status MTL','Tgl MTL'],
    body:vis.map((r,i)=>{const b=hasBPO(r),m=hasMTL(r);return[i+1,...base(r),
      b?n2(r.pupukCair):'',b?n2(r.pupukPadat):'',b?(r.tglBPO?'Sudah Bayar':'Belum Bayar'):'',b?fmtDate(r.tglBPO):'',
      m?rp(r.insentifMTL):'',m?(r.tglMTL?'Sudah Bayar':'Belum Bayar'):'',m?fmtDate(r.tglMTL):''];})};
}

const NO_KTH='Tanpa KTH';
function kthData(){
  const by={};
  const get=r=>{const k=r.kth||NO_KTH;return by[k]||(by[k]={kth:k,desa:new Set(),lahan:0,petaniSet:new Set(),agro:0,temb:0,ditanam:0,tanaman:0});};
  rows.forEach(r=>{
    if(inPeriod(r.tglPartisipasi)){
      const o=get(r);
      o.lahan++;o.agro+=r.luasAgroAT;o.temb+=r.luasTembAU;
      if(r.desa)o.desa.add(r.desa);
      if(r.petani)o.petaniSet.add(r.petani.toLowerCase());
    }
    if(inPeriod(r.tglRealisasi)){
      const o=get(r);
      o.ditanam+=r.prog.startsWith('Agro')?r.luasAgro:r.luasTemb;o.tanaman+=r.jumlahTanaman;
    }
  });
  return Object.values(by).map(o=>({...o,desa:[...o.desa].sort().join(', '),petani:o.petaniSet.size,luas:o.agro+o.temb,
    pctTanam:pctOf(o.ditanam,o.agro+o.temb)}))
    .sort((a,b)=>b.luas-a.luas||b.ditanam-a.ditanam);
}

function placeKbTip(row){

  tip.style.display='block';
  const r=row.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  const left=Math.max(8,Math.min(r.left+Math.min(150,r.width/3),vw-w-8));

  tip.style.display='';
}

// wide = PDF A3 dengan huruf lebih kecil
async function exportTable(type,hdr,body,title,prefix,wide){
  const fname=`${prefix}_${periodLabel().replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')}`;
  const sub=`PT Citra Mulia Inti | ${periodLabel()} | ${body.length} baris | ${fmtD(new Date(),'l')}`;
  const reg=wide;
  if(type==='csv'){
    const csv=[hdr,...body].map(r=>r.map(v=>`"${str(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    dlBlob(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),fname+'.csv');
  }else if(type==='xlsx'){
    if(!window.XLSX){alert('Library Excel belum dimuat.');return;}
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hdr,...body]),'Data');
    XLSX.writeFile(wb,fname+'.xlsx');
  }else if(type==='pdf'){
    if(!window.jspdf){alert('Library PDF belum dimuat.');return;}
    const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:reg?'a3':'a4'});
    doc.setFontSize(14);doc.setTextColor(53,103,96);doc.text(title,40,32);
    doc.setFontSize(9);doc.setTextColor(100,116,139);doc.text(sub,40,48);
    doc.autoTable({head:[hdr],body,startY:60,styles:{fontSize:reg?6.5:8,cellPadding:3},headStyles:{fillColor:[53,103,96],textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[248,250,252]}});
    doc.save(fname+'.pdf');
  }else{
    if(!window.docx){alert('Library Word belum dimuat.');return;}
    const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,AlignmentType,WidthType,BorderStyle,ShadingType,VerticalAlign}=window.docx;
    const brd={style:BorderStyle.SINGLE,size:1,color:'D1D5DB'},bA={top:brd,bottom:brd,left:brd,right:brd};
    const cell=(t,o={})=>new TableCell({verticalAlign:VerticalAlign.CENTER,borders:bA,shading:o.bg?{fill:o.bg,type:ShadingType.CLEAR,color:'auto'}:undefined,margins:{top:60,bottom:60,left:100,right:100},
      children:[new Paragraph({alignment:AlignmentType.LEFT,children:[new TextRun({text:String(t??'—'),bold:!!o.bold,color:o.color||'000000',size:16,font:'Arial'})]})]});
    const table=new Table({width:{size:9500,type:WidthType.DXA},rows:[
      new TableRow({tableHeader:true,children:hdr.map(h=>cell(h,{bg:'356760',bold:true,color:'FFFFFF'}))}),
      ...body.map((r,i)=>new TableRow({children:r.map(v=>cell(v,{bg:i%2===0?'F8FAFC':'FFFFFF'}))}))]});
    const doc=new Document({sections:[{properties:{page:{size:{width:20160,height:12240,orientation:'landscape'},margin:{top:720,right:720,bottom:720,left:720}}},
      children:[new Paragraph({children:[new TextRun({text:title.toUpperCase(),bold:true,size:32,color:'356760',font:'Arial'})]}),
        new Paragraph({children:[new TextRun({text:sub,size:18,color:'64748B',font:'Arial'})]}),new Paragraph({children:[]}),table]}]});
    try{dlBlob(await Packer.toBlob(doc),fname+'.docx');}catch(e){alert('Gagal membuat Word.');}
  }
}

function weekPickerHtml(){
  const yrs=[...new Set([...years,new Date().getFullYear(),weekYear])].sort((a,b)=>a-b);
  const weeks=getWeeksInMonth(weekYear,weekMonth),sel=weekIdx??defaultWeekIdx();
  return`
    <select class="filter-select" aria-label="Tahun" onchange="setWeekYear(this.value)">${yrs.map(y=>`<option value="${y}"${y===weekYear?' selected':''}>${y}</option>`).join('')}</select>
    <select class="filter-select" aria-label="Bulan" onchange="setWeekMonth(this.value)">${MN.map((m,i)=>`<option value="${i}"${i===weekMonth?' selected':''}>${m}</option>`).join('')}</select>
    <select class="filter-select" aria-label="Minggu" onchange="setWeekPick(this.value)">${weeks.map((w,i)=>`<option value="${i}"${i===sel?' selected':''}>${w.label} (${fmtD(w.sat,'s')}–${fmtD(w.fri,'s')})</option>`).join('')}</select>`;
}

function render(){
  const yq=periodMode==='yq';
  const s=compute(),ins=insSummary(),kth=kthData();
  const card=(lbl,val,sub)=>`<div class="card"><div class="card-lbl">${lbl}</div><div class="card-val-lg">${val}</div>${sub?`<div class="card-sub-pct">${sub}</div>`:''}</div>`;
  const plantPct=pctOf(s.ditanam,s.real);
  const top3=s.species.slice(0,3).map(([n])=>esc(n));
  const joinID=l=>l.length<=1?l.join(''):l.slice(0,-1).join(', ')+' dan '+l[l.length-1];
  const tgtTxt=targetLabel().replace(/^Target/,'target');
  const note=`${isAllTime()?'Sepanjang program':`Dalam periode ${periodLabel()}`}, sebanyak ${fmtInt(s.lahan)} lahan seluas ${fmt(s.real)} ha terdaftar dalam program ARR`
    +(s.pct===null?'':s.base.acc
      ?`, dengan akumulasi ${s.base.month} ${fmt(s.base.a+s.base.t)} ha atau ${fmtPct(s.pct)}% dari ${tgtTxt} sebesar ${fmt(s.target)} ha`
      :`, atau ${fmtPct(s.pct)}% dari ${tgtTxt} sebesar ${fmt(s.target)} ha`)
    +`. Lahan tersebut dikelola oleh ${fmtInt(s.petani)} petani. Sejauh ini ${fmt(s.ditanam)} ha sudah ditanami ${fmtInt(s.tanaman)} pohon`
    +(top3.length?`, dengan ${joinID(top3)} sebagai jenis yang paling banyak ditanam.`:'.');
  const page=document.getElementById('pageBody');
  page.innerHTML=`
    <div class="filter-row" style="margin-bottom:6px">
      <span class="filter-lbl">Filter</span>
      <button class="fpill${yq&&currentYear==='all'?' active':''}" onclick="setFilter('all')">All</button>
      ${years.map(y=>`<button class="fpill${yq&&currentYear===String(y)?' active':''}" onclick="setFilter('${y}')">${y}</button>`).join('')}
    </div>
    <div class="filter-row" style="margin-bottom:6px">
      <span class="filter-lbl">Quarter</span>
      <button class="fpill${yq&&currentQuarter==='all'?' active':''}" onclick="setQuarter('all')">All</button>
      ${QUARTERS.map(q=>`<button class="fpill${yq&&currentQuarter===q?' active':''}" onclick="setQuarter('${q}')">Q${q}</button>`).join('')}
    </div>
    <div class="filter-row">
      <span class="filter-lbl">Periode</span>
      <button class="fpill${periodMode==='ytd'?' active':''}" onclick="setPeriod('ytd')">Year to Date</button>
      <button class="fpill${periodMode==='mtd'?' active':''}" onclick="setPeriod('mtd')">Month to Date</button>
      <button class="fpill${periodMode==='week'?' active':''}" onclick="setPeriod('week')">Mingguan</button>
      ${periodMode==='week'?weekPickerHtml():''}
    </div>

    <div class="sec-title">ARR</div>
    <div class="grid-row">
      ${card('Total Lahan',`${fmt(s.real)} ha`,s.pct!==null?`${fmtPct(s.pct)}% dari ${tgtTxt} ${fmt(s.target)} ha${s.base.acc?' (akumulasi bulan)':''}`:'target belum tersedia')}
      ${card('Anggota Petani Terdaftar',fmtInt(s.petani),`${fmtInt(s.laki)} laki-laki, ${fmtInt(s.pmp)} perempuan`)}
      ${card('Luas Sudah Ditanam',`${fmt(s.ditanam)} ha`,plantPct!==null?`${fmtPct(plantPct)}% dari luas terdaftar`:'—')}
      ${card('Jumlah Tanaman',fmtInt(s.tanaman),`${fmtInt(s.tanA)} agro, ${fmtInt(s.tanT)} reforestasi`)}
    </div>
    <p class="page-note kpi-note">${note}</p>

    <div class="row-head">
      <div class="row-title">Capaian Luas Program</div>
      <div class="row-desc">Menampilkan capaian luas lahan terdaftar terhadap target, serta pembagian luas tersebut ke program agroforestri dan reforestasi beserta sub programnya.</div>
    </div>
    <div class="chart-pair even">
      ${targetCardHTML(s)}
      ${subProgramCardHTML(s)}
    </div>

    <div class="row-head">
      <div class="row-title">Partisipasi Petani &amp; Lahan</div>
      <div class="row-desc">Menampilkan komposisi petani yang terdaftar dalam program berdasarkan jenis kelamin, serta pertambahan luas lahan baru yang terdaftar setiap ${bucketUnit()}.</div>
    </div>
    <div class="chart-pair">
      ${petaniCardHTML(s)}
      ${trendCardHTML()}
    </div>

    <div class="row-head">
      <div class="row-title">Kinerja per KTH</div>
      <div class="row-desc">Menampilkan kontribusi setiap Kelompok Tani Hutan (KTH) terhadap luas program, serta progres penanaman di masing-masing KTH. Profil kelembagaan KTH tersedia di halaman <a href="kth.html">KTH</a>.</div>
    </div>
    <div class="chart-pair even">
      ${kthLuasCardHTML(kth)}
      ${kthTanamCardHTML(kth)}
    </div>
    ${kthTableCardHTML()}

    <div class="row-head">
      <div class="row-title">Realisasi Penanaman</div>
      <div class="row-desc">Menampilkan progres penanaman dibandingkan luas lahan terdaftar, serta jenis tanaman yang paling banyak ditanam. Lahan dihitung sudah ditanam bila telah memiliki tanggal realisasi.</div>
    </div>
    <div class="chart-pair even">
      ${plantingCardHTML(s)}
      ${speciesCardHTML(s)}
    </div>

    <div class="row-head">
      <div class="row-title">Insentif Program</div>
      <div class="row-desc">Menampilkan status pembayaran insentif bagi lahan yang bergabung pada periode terpilih, baik insentif reguler per tahap maupun program tahunan (pupuk organik dan menjaga tutupan lahan), beserta data lengkap per lahan.</div>
    </div>
    <div class="grid-row">
      ${card('Insentif Reguler Dibayar',fmtRp(ins.regPaid))}
      ${card('Insentif MTL Dibayar',fmtRp(ins.mtlPaid))}
      ${card('Pupuk Cair Dibagikan',`${fmt(ins.cairPaid)} L`)}
      ${card('Pupuk Padat Dibagikan',`${fmt(ins.padatPaid)} kg`)}
    </div>
    <div class="chart-pair wide">
      ${insStageCardHTML()}
      ${insThnCardHTML(ins)}
    </div>
    ${insTableCardHTML()}
  `;
  updateInsTable();
  updateKTHTable();
  page.querySelectorAll('.kb-row').forEach(row=>{
    ['mouseenter','mousemove','focus'].forEach(ev=>row.addEventListener(ev,()=>placeKbTip(row)));
  });
  drawLine();
}

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [csvTxt,tgtTxt]=await Promise.all([getText(CSV_URL),getText(TARGET_URL).catch(()=>'')]);
    parseSheet(csvTxt);
    if(tgtTxt)parseTargetSheet(tgtTxt);
    const ys=new Set();
    rows.forEach(r=>{if(r.tglPartisipasi)ys.add(r.tglPartisipasi.getFullYear());});
    Object.keys(targetData).forEach(y=>ys.add(+y));
    years=[...ys].sort((a,b)=>a-b);
    currentYear=years.length?String(years[years.length-1]):'all';
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
