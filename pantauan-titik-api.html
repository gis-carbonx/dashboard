<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pantauan Titik Api | Monitoring Fire Event | Sanggala Corridor Project</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-cream:#FFFAF3;
    --color-sand:#DCDACC;
    --color-sage:#B5BBA9;
    --color-moss:#8C9F8B;
    --color-fern:#618273;
    --color-pine:#356760;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Inter',Arial,Helvetica,sans-serif;background:var(--color-cream);color:#2b2b28}
  body{display:flex;flex-direction:column}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600}

  /* SITE NAVBAR */
  .site-navbar{
    flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:10px 32px;background-color:var(--color-cream);border-bottom:1px solid var(--color-sand);
  }
  .site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
  .site-navbar-brand img{width:28px;height:28px;object-fit:contain}
  .site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--color-pine);font-family:'Inter',sans-serif}
  .site-navbar-menu{display:flex;gap:32px;justify-self:center}
  .site-navbar-menu a{text-decoration:none;color:var(--color-fern);font-size:13px;font-weight:500}
  .site-navbar-menu a:hover,.site-navbar-menu a.active{color:var(--color-pine)}
  .site-navbar-spacer{justify-self:end}
  @media (max-width:768px){
    .site-navbar{grid-template-columns:auto auto;padding:10px 16px}
    .site-navbar-menu{gap:14px;justify-self:end}
    .site-navbar-spacer{display:none}
  }

  /* DASHBOARD FRAME */
  .dashboard-frame{
    flex:1;min-height:0;margin:0 28px 28px 28px;border:1px solid var(--color-sand);
    overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.08);background:#fff;
    display:flex;flex-direction:column;
  }

  /* TOP BAR — sama persis dengan Monitoring Fire Event, tanpa "Terakhir diperbarui" */
  .fire-topbar{
    background:#3A342C;border-bottom:1px solid #4a4238;
    padding:14px 0;flex-shrink:0;
  }
  .fire-topbar-inner{
    max-width:1180px;margin:0 auto;padding:0 36px;
  }
  .report-title{font-size:20px;color:#fff;letter-spacing:-.2px;font-weight:600}
  .report-subtitle{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px;font-family:'Inter',sans-serif}

  .iframe-wrap{flex:1;min-height:0;position:relative;background:var(--color-cream)}
  .iframe-wrap iframe{width:100%;height:100%;border:none;display:block}
  .iframe-loading{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:var(--color-cream);color:var(--color-fern);font-size:12px;font-family:'Inter',sans-serif;
  }
  .spinner{
    width:28px;height:28px;border:3px solid var(--color-sand);border-top-color:var(--color-fern);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="fire-topbar">
    <div class="fire-topbar-inner">
      <h1 class="report-title">Monitoring Fire Event</h1>
      <div class="report-subtitle" id="reportDateToday">&ndash;</div>
    </div>
  </div>
  <div class="iframe-wrap">
    <div class="iframe-loading" id="loadingOverlay">
      <div class="spinner"></div>
      <span>Memuat Pantauan Titik Api&hellip;</span>
    </div>
    <iframe
      src="https://g-adzan.github.io/sanggala_hotspot_tracker/"
      title="Pantauan Titik Api Sanggala"
      allowfullscreen
      onload="document.getElementById('loadingOverlay').style.display='none'">
    </iframe>
  </div>
</div>

<script>
const MN_SHORT=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
document.getElementById('reportDateToday').textContent =
  new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
</script>

<script src="auth-guard.js"></script>
</body>
</html>
