<script>
'use strict';
const SHEET_ID='1-LHCIUy1iD154WczY4Da_-iRaILtvL0mOW4gRW6YQac',SHEET_NAME='ARR_SUMMARY',TARGET_NAME='TARGET_CAPAIAN';
const CACHE_BUST='?v='+Date.now();
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
const TARGET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TARGET_NAME)}`;

const str=v=>(v??'').toString().trim();
const num=v=>sheetNum(v);
const fmt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseDate(s){return sheetDate(s,'mdy');}
function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
function colV(raw,keys,names,idx){
  const v=pickCI(raw,keys,...names);
  if(v!==undefined)return v;
  return idx!=null&&keys[idx]!==undefined?raw[keys[idx]]:undefined;
}
function resolveProgram(aReg,aBPO,tReg,tMTL,tipe){
  if(aReg>0)return'Agro_Reg';if(aBPO>0)return'Agro_BPO';
  if(tReg>0)return'Temb_Reg';if(tMTL>0)return'Temb_MTL';
  const t=tipe.toLowerCase();
  return t.includes('tembawang')?'Temb_Reg':t.includes('agro')?'Agro_Reg':null;
}

let sheetMap={},targetData={},currentYear='all',currentQuarter='all',years=[];
const QUARTERS=['1','2','3','4'];
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let periodMode='yq',weekYear=new Date().getFullYear(),weekMonth=new Date().getMonth(),weekIdx=null;

function getWeeksInMonth(yr,mo){
  let sat=new Date(yr,mo,1);sat.setDate(sat.getDate()-((sat.getDay()+1)%7));
  const last=new Date(yr,mo+1,0),weeks=[];let n=1;
  while(sat<=last){const fri=new Date(sat);fri.setDate(fri.getDate()+6);weeks.push({sat:new Date(sat),fri,label:`Minggu ke-${n++}`});sat.setDate(sat.getDate()+7);}
  return weeks;
}
function fmtD(d,t){return d.toLocaleDateString('id-ID',t==='s'?{day:'numeric',month:'short'}:{day:'numeric',month:'long',year:'numeric'});}
function defaultWeekIdx(){
  const now=new Date();let best=0;
  getWeeksInMonth(weekYear,weekMonth).forEach((w,i)=>{if(w.sat<=now&&now<=w.fri)best=i;});
  return best;
}
function getSelectedWeek(){
  const weeks=getWeeksInMonth(weekYear,weekMonth);
  return weeks[weekIdx??defaultWeekIdx()]||weeks[0]||null;
}

async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

function parseSheet(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  const plantCols=[],existCols=[];
  (data.length?Object.keys(data[0]):[]).forEach(h=>{
    let m=h.match(/^P-\s*(.+)$/i);
    if(m){plantCols.push({header:h,name:m[1].trim()});return;}
    m=h.match(/^E-\s*(.+)$/i);
    if(m)existCols.push({header:h,name:m[1].trim()});
  });
  data.forEach(raw=>{
    const id=str(raw['ID_Petak']||raw['id_petak']||raw['ID Petak']||raw['I']||'');if(!id)return;
    const kth=str(raw['KTH']||raw['C']||''),tipe=str(raw['Tipe']||raw['E']||'');
    const petani=str(raw['Petani']||raw['F']||''),jk=str(raw['Jenis Kelamin']||raw['Jenis_Kelamin']||raw['G']||'');
    const tglPartisipasi=str(raw['Tgl_Partisipasi']||raw['Tgl Partisipasi']||raw['J']||'');
    const tglRealisasi=str(raw['Tgl_Realisasi']||raw['Tgl Realisasi']||raw['K']||'');
    const aReg=num(raw['Agro_Reg']||raw['Agro Reg']||raw['L']||0),aBPO=num(raw['Agro_BPO']||raw['Agro BPO']||raw['M']||0);
    const tReg=num(raw['Temb_Reg']||raw['Temb Reg']||raw['N']||0),tMTL=num(raw['Temb_MTL']||raw['Temb MTL']||raw['O']||0);
    const keys=Object.keys(raw);
    const k=i=>keys[i]?str(raw[keys[i]]):'';
    const luasAgro=num(colV(raw,keys,['luas_agro','Luas_Agro'],45));
    const luasTemb=num(colV(raw,keys,['luas_temb','Luas_Temb'],46));
    const luasENL=num(pickCI(raw,keys,'ENL'));
    const luasENP=num(pickCI(raw,keys,'ENP'));
    const tglTanam=parseDate(tglRealisasi);
    const plantEvents=tglTanam?plantCols.map(c=>({d:tglTanam,name:c.name,n:num(raw[c.header])})).filter(e=>e.n>0):[];
    const existingPlants=existCols.map(c=>({name:c.name,count:num(raw[c.header])})).filter(p=>p.count>0);
    const prog=resolveProgram(aReg,aBPO,tReg,tMTL,tipe);
    if(!prog&&luasENL<=0&&luasENP<=0)return;
    const _luasAgro=luasAgro>0?luasAgro:aReg+aBPO;
    const _luasTemb=luasTemb>0?luasTemb:tReg+tMTL;
    sheetMap[id]={id,kth,petani,jk,tglPartisipasi,tglRealisasi:tglTanam,aReg,aBPO,tReg,tMTL,luasAgro:_luasAgro,luasTemb:_luasTemb,luasENL,luasENP,prog,plantEvents,existingPlants};
  });
}
function parseLog(csv){
  const log=parseActivityLog(csv);
  if(!log.hasTanam)return;
  Object.values(sheetMap).forEach(r=>{
    r.plantEvents=log.tanam[r.id.toUpperCase()]||[];
    r.tglRealisasi=r.plantEvents.length?r.plantEvents[0].d:null;
  });
}
const plantsIn=r=>r.plantEvents.reduce((a,e)=>matchesDateFilter(e.d)?a+e.n:a,0);
const plantTotals=r=>Object.entries(r.plantEvents.reduce((o,e)=>(o[e.name]=(o[e.name]||0)+e.n,o),{})).map(([name,count])=>({name,count})).filter(p=>p.count>0);

function parseTargetSheet(csv){
  const {data}=Papa.parse(csv,{header:false,skipEmptyLines:true});
  targetData={};
  data.forEach((row,i)=>{
    if(!i)return;
    const uraian=str(row[0]).toLowerCase(),tahun=parseInt(str(row[2]));
    if(!uraian||isNaN(tahun)||tahun<2000)return;
    const isA=uraian.includes('agro')&&!uraian.includes('bpo');
    const isT=uraian==='tembawang';
    const isENP=uraian==='pa'||uraian.includes('protected');
    const isENL=uraian==='loa'||uraian.includes('logged');
    if(!isA&&!isT&&!isENP&&!isENL)return;
    if(!targetData[tahun])targetData[tahun]={agro_utama:0,temb_utama:0,agro_total:0,temb_total:0,enp_utama:0,enl_utama:0,enp_total:0,enl_total:0,monthly:Array.from({length:12},()=>({agro:0,temb:0}))};
    const td=targetData[tahun];
    const utama=parseFloat(str(row[1]))||0,total=parseFloat(str(row[15]))||0;
    if(isA){td.agro_utama+=utama;td.agro_total+=total;}
    if(isT){td.temb_utama+=utama;td.temb_total+=total;}
    if(isENP){td.enp_utama+=utama;td.enp_total+=total;}
    if(isENL){td.enl_utama+=utama;td.enl_total+=total;}
    for(let m=0;m<12;m++){
      const v=parseFloat(str(row[3+m]))||0;
      if(isA)td.monthly[m].agro+=v;
      if(isT)td.monthly[m].temb+=v;
    }
  });
}

const NURSERY_SHEET_ID='1or3IIjtpas5QD8PRAfO8WdhW6iTc-xH7v0B7hNOAF5M';
const NURSERY_URL=`https://docs.google.com/spreadsheets/d/${NURSERY_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Log`;
const NCAT={pemb:'pembesaranregular',matiPemb:'matipembesaran',bst:'bstregular',matiBst:'matibstregular',tanam:'penanaman',sulam:'penyulaman',support:'support'};
let nurseryRows=null;
function parseNursery(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  nurseryRows=[];
  data.forEach(raw=>{
    const keys=Object.keys(raw);
    const cat=str(pickCI(raw,keys,'Tipe Kegiatan','Category')).toLowerCase().replace(/[^a-z]/g,'');
    const jenis=str(pickCI(raw,keys,'Jenis Tanaman'));
    if(!cat||!jenis||jenis==='#N/A')return;
    const m=str(pickCI(raw,keys,'Tanggal')).match(/^(\d{4})-(\d{2})-(\d{2})/);
    nurseryRows.push({
      date:m?new Date(+m[1],+m[2]-1,+m[3]):null,
      jenis:jenis.toLowerCase(),cat,
      jumlah:parseFloat(str(pickCI(raw,keys,'Jumlah')).replace(/,/g,''))||0
    });
  });
}
function periodEndDate(){
  const now=new Date();
  if(periodMode==='week'){const wk=getSelectedWeek();if(wk){const e=new Date(wk.fri);e.setHours(23,59,59,999);return e<now?e:null;}}
  if(periodMode!=='yq'||currentYear==='all')return null;
  const y=+currentYear,q=currentQuarter==='all'?4:+currentQuarter;
  const e=new Date(y,q*3,0,23,59,59,999);
  return e<now?e:null;
}
function matchesDateFilter(d){
  if(!d)return false;
  const now=new Date();
  if(periodMode==='ytd')return d.getFullYear()===now.getFullYear()&&d<=now;
  if(periodMode==='mtd')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d<=now;
  if(periodMode==='week'){const wk=getSelectedWeek();return !!wk&&d>=wk.sat&&d<=new Date(wk.fri.getFullYear(),wk.fri.getMonth(),wk.fri.getDate(),23,59,59);}
  if(currentYear!=='all'&&d.getFullYear()!==+currentYear)return false;
  if(currentQuarter!=='all'&&Math.floor(d.getMonth()/3)+1!==+currentQuarter)return false;
  return true;
}
function computeNursery(){
  if(!nurseryRows)return null;
  const end=periodEndDate();
  const upTo=nurseryRows.filter(r=>!end||(r.date&&r.date<=end));
  const by={};
  upTo.forEach(r=>{const o=by[r.jenis]||(by[r.jenis]={});o[r.cat]=(o[r.cat]||0)+r.jumlah;});
  let pemb=0,bst=0;
  Object.values(by).forEach(c=>{
    const g=k=>c[k]||0;
    pemb+=Math.max(0,g(NCAT.pemb)-g(NCAT.matiPemb)-g(NCAT.bst));
    bst+=Math.max(0,g(NCAT.bst)-g(NCAT.matiBst)-g(NCAT.tanam)-g(NCAT.sulam)-g(NCAT.support));
  });
  const last=upTo.reduce((a,r)=>r.date&&(!a||r.date>a)?r.date:a,null);
  const dist={tanam:0,sulam:0,support:0};
  nurseryRows.forEach(r=>{
    if(!matchesDateFilter(r.date))return;
    if(r.cat===NCAT.tanam)dist.tanam+=r.jumlah;
    else if(r.cat===NCAT.sulam)dist.sulam+=r.jumlah;
    else if(r.cat===NCAT.support)dist.support+=r.jumlah;
  });
  return{pemb,bst,stok:pemb+bst,asOf:end||last,dist,distTotal:dist.tanam+dist.sulam+dist.support};
}

function matchesFilter(row,field){
  const d=parseDate(row[field]);
  if(!d)return false;
  const now=new Date();
  if(periodMode==='ytd')return d.getFullYear()===now.getFullYear()&&d<=now;
  if(periodMode==='mtd')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d<=now;
  if(periodMode==='week'){const wk=getSelectedWeek();return !!wk&&d>=wk.sat&&d<=wk.fri;}
  if(currentYear!=='all'&&d.getFullYear()!==+currentYear)return false;
  if(currentQuarter!=='all'&&Math.floor(d.getMonth()/3)+1!==+currentQuarter)return false;
  return true;
}

function computeAreas(){
  let agro=0,temb=0,enp=0,enl=0;
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    agro+=r.luasAgro;temb+=r.luasTemb;enp+=r.luasENP;enl+=r.luasENL;
  });
  return{agro,temb,enp,enl};
}

function computeSubAreas(){
  let aRegHa=0,aBPOHa=0,tRegHa=0,tMTLHa=0;
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    aRegHa+=r.aReg;aBPOHa+=r.aBPO;tRegHa+=r.tReg;tMTLHa+=r.tMTL;
  });
  return{aRegHa,aBPOHa,tRegHa,tMTLHa};
}

function computeTanamanTotal(){
  let total=0,agro=0,temb=0;
  Object.values(sheetMap).forEach(r=>{
    const n=plantsIn(r);
    total+=n;
    if(r.prog?.startsWith('Agro'))agro+=n;
    else if(r.prog?.startsWith('Temb'))temb+=n;
  });
  return{total,agro,temb};
}

function computePlanting(){
  let agro=0,temb=0,lahanA=0,lahanT=0,addA=0,addT=0,addTanA=0,addLuasA=0,addLuasT=0;const speciesMap={},petaniA=new Set(),petaniT=new Set();
  Object.values(sheetMap).forEach(r=>{
    const isAgro=r.prog?.startsWith('Agro'),isTemb=r.prog?.startsWith('Temb');
    r.plantEvents.forEach(e=>{if(e.n&&matchesDateFilter(e.d))speciesMap[e.name]=(speciesMap[e.name]||0)+e.n;});
    if(!matchesFilter(r,'tglRealisasi')){
      if(r.tglRealisasi&&!matchesFilter(r,'tglPartisipasi')&&r.plantEvents.some(e=>matchesDateFilter(e.d))){
        if(isAgro){addA++;addTanA+=plantsIn(r);addLuasA+=r.luasAgro;}
        else if(isTemb){addT++;addLuasT+=r.luasTemb;}
      }
      return;
    }
    agro+=r.luasAgro;temb+=r.luasTemb;
    if(isAgro||isTemb){
      if(isAgro)lahanA++;else lahanT++;
      if(r.petani&&str(r.jk).trim())(isAgro?petaniA:petaniT).add(r.petani.toLowerCase());
    }
  });
  const species=Object.entries(speciesMap).sort((a,b)=>b[1]-a[1]).map(([name])=>name);
  return{luas:agro+temb,agro,temb,species,lahanA,lahanT,addA,addT,addTanA,addLuasA,addLuasT,petaniA:petaniA.size,petaniT:petaniT.size};
}
function joinID(list){
  return list.length<=1?list.join(''):list.slice(0,-1).join(', ')+(list.length>2?',':'')+' dan '+list[list.length-1];
}

function periodTargetYear(){
  if(periodMode==='ytd'||periodMode==='mtd')return new Date().getFullYear();
  if(periodMode==='week'){const wk=getSelectedWeek();return wk?wk.fri.getFullYear():null;}
  return null;
}
function computeTarget(){
  if(periodMode!=='yq'){
    const td=targetData[periodTargetYear()];
    return td?{agro:td.agro_total??null,temb:td.temb_total??null}:{agro:null,temb:null};
  }
  if(currentYear==='all'){
    let agro=0,temb=0,found=false;
    Object.values(targetData).forEach(td=>{agro+=td.agro_utama||0;temb+=td.temb_utama||0;found=true;});
    return found?{agro,temb}:{agro:null,temb:null};
  }
  const td=targetData[+currentYear];
  return td?{agro:td.agro_total??null,temb:td.temb_total??null}:{agro:null,temb:null};
}
const TGT_KEYS=['agro','temb'];
function periodTarget(){
  const pick=(td,suffix,label)=>{
    if(!td)return{label};
    const o={label};TGT_KEYS.forEach(k=>{o[k]=td[`${k}_${suffix}`]||null;});return o;
  };
  const sumMonths=(td,ms,label)=>{
    const o={label};
    if(!td||!td.monthly)return o;
    TGT_KEYS.forEach(k=>{o[k]=ms.reduce((s,m)=>s+td.monthly[m][k],0)||null;});
    return o;
  };
  const now=new Date();
  if(periodMode==='ytd')return pick(targetData[now.getFullYear()],'total','target tahunan');
  if(periodMode==='mtd')return sumMonths(targetData[now.getFullYear()],[now.getMonth()],'target bulanan');
  if(periodMode==='week'){const wk=getSelectedWeek();return wk?sumMonths(targetData[wk.fri.getFullYear()],[wk.fri.getMonth()],'target bulanan'):{label:''};}
  if(currentYear==='all'){
    const o={label:'target keseluruhan'};
    TGT_KEYS.forEach(k=>{o[k]=Object.values(targetData).reduce((s,td)=>s+(td[`${k}_utama`]||0),0)||null;});
    return o;
  }
  const td=targetData[+currentYear];
  if(currentQuarter==='all')return pick(td,'total','target tahunan');
  const q=+currentQuarter;
  return sumMonths(td,[3*q-3,3*q-2,3*q-1],`target Q${q}`);
}
function targetRealAreas(areas){
  if(periodMode!=='week')return areas;
  const wk=getSelectedWeek();if(!wk)return areas;
  let agro=0,temb=0;
  Object.values(sheetMap).forEach(r=>{
    const d=parseDate(r.tglPartisipasi);
    if(!d||d.getFullYear()!==wk.fri.getFullYear()||d.getMonth()!==wk.fri.getMonth()||d>wk.fri)return;
    agro+=r.luasAgro;temb+=r.luasTemb;
  });
  return{agro,temb};
}
function computeSubPetani(){
  const s={aReg:new Set(),aBPO:new Set(),tReg:new Set(),tMTL:new Set()};
  Object.values(sheetMap).forEach(r=>{
    if(!r.petani||!matchesFilter(r,'tglPartisipasi'))return;
    const p=r.petani.toLowerCase();
    Object.keys(s).forEach(k=>{if(r[k]>0)s[k].add(p);});
  });
  return{aReg:s.aReg.size,aBPO:s.aBPO.size,tReg:s.tReg.size,tMTL:s.tMTL.size};
}
const subLines=(...lines)=>lines.map((l,i)=>`<div class="card-sub-pct"${i?' style="margin-top:2px"':''}>${l}</div>`).join('');
function pctOfTarget(val,target,label){
  if(target===null||target===undefined||!(target>0))return'target belum tersedia';
  return`${(val/target*100).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})}% ${label}`;
}
function pctText(val,target){
  if(target===null||target===undefined||target<=0)return'';
  const partial=periodMode==='yq'?currentQuarter!=='all':periodMode!=='ytd';
  return(val/target*100).toFixed(1)+(partial?'% dari target tahunan':'% dari target');
}

function computePesertaTotal(){
  const all=new Set(),agro=new Set(),temb=new Set();
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    if(!r.petani||!str(r.jk).trim())return;
    const p=r.petani.toLowerCase();
    all.add(p);
    if(r.luasAgro>0)agro.add(p);
    if(r.luasTemb>0)temb.add(p);
  });
  return{total:all.size,agro:agro.size,temb:temb.size};
}

function computeKTHCount(){
  const set=new Set();
  Object.values(sheetMap).forEach(r=>{
    const v=str(r.kth).trim();
    if(v&&v.toLowerCase().includes('kth'))set.add(v.toLowerCase());
  });
  return set.size;
}

function computePetakCount(){
  let n=0;
  Object.values(sheetMap).forEach(r=>{if(matchesFilter(r,'tglPartisipasi'))n++;});
  return n;
}

const GROUP_STYLE={agro:{label:'Agroforestri',color:'#2e7d32',stroke:'#0f3d13'},temb:{label:'Reforestasi',color:'#d9480f',stroke:'#7a2300'}};
const PROG_INFO={
  Agro_Reg:{group:'agro',label:'Agroforestri Reguler'},
  Agro_BPO:{group:'agro',label:'Bantuan Pupuk Organik'},
  Temb_Reg:{group:'temb',label:'Reforestasi Reguler'},
  Temb_MTL:{group:'temb',label:'Menjaga Tutupan Lahan'},
};
const lahanLuas=r=>PROG_INFO[r.prog].group==='agro'?r.luasAgro:r.luasTemb;
let sebaranMap=null,lgLahan=null,cmiBounds=null,lahanLayers={},selectedLahan=null;

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.json();}
function featId(f){const p=f.properties||{};return str(p.id_lahan||p.ID_Petak||p.id_petak||p.ID_LAHAN||p.Id_Lahan||p.IDLAHAN||'');}
function lahanStyle(id){
  const g=GROUP_STYLE[PROG_INFO[sheetMap[id].prog].group],sel=id===selectedLahan;
  return{color:sel?'#1d4ed8':g.stroke,weight:sel?3.5:1.8,fillColor:g.color,fillOpacity:sel?.9:.75,opacity:1};
}

async function initSebaran(){
  document.getElementById('sebaranSection').style.display='';
  sebaranMap=L.map('sebaranMap',{zoomControl:true,attributionControl:false,scrollWheelZoom:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(sebaranMap);
  sebaranMap.setView([0,110],8);
  const [agroJ,cmiJ]=await Promise.all([
    getJSON('assets/json/agro.json'+CACHE_BUST).catch(e=>{console.warn('Gagal memuat agro.json',e);return null;}),
    getJSON('assets/json/CMI.json'+CACHE_BUST).catch(e=>{console.warn('Gagal memuat CMI.json',e);return null;})
  ]);
  if(cmiJ){
    const cmi=L.geoJSON(cmiJ,{interactive:false,style:()=>({color:'#334155',weight:2,fillOpacity:0,opacity:.9})}).addTo(sebaranMap);
    cmiBounds=cmi.getBounds();
  }
  lgLahan=L.featureGroup().addTo(sebaranMap);
  (agroJ?(agroJ.type==='FeatureCollection'?agroJ.features:[agroJ]):[]).forEach(f=>{
    const id=featId(f),row=sheetMap[id];
    if(!row||!PROG_INFO[row.prog])return;
    const layer=L.geoJSON(f,{style:()=>lahanStyle(id)});
    layer.on('click',()=>selectLahan(id));
    layer.on('mouseover',e=>e.target.setStyle({fillOpacity:.9}));
    layer.on('mouseout',()=>layer.setStyle(lahanStyle(id)));
    lahanLayers[id]=layer;
  });
  updateSebaran(true);
}

function updateSebaran(fit){
  if(!lgLahan)return;
  lgLahan.clearLayers();
  let n=0;
  Object.entries(lahanLayers).forEach(([id,layer])=>{
    if(!matchesFilter(sheetMap[id],'tglPartisipasi'))return;
    lgLahan.addLayer(layer);n++;
  });
  if(selectedLahan&&!lgLahan.hasLayer(lahanLayers[selectedLahan]))selectLahan(null);
  if(fit){
    const b=n?lgLahan.getBounds():cmiBounds;
    if(b&&b.isValid())sebaranMap.fitBounds(b,{padding:[20,20]});
  }
}

  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [csvTxt,tgtTxt,nurTxt,logTxt]=await Promise.all([
      getText(CSV_URL),
      getText(TARGET_URL).catch(()=>''),
      getText(NURSERY_URL).catch(e=>{console.warn('Gagal memuat data nursery',e);return'';}),
      getText(ACTIVITY_LOG_URL).catch(()=>'')
    ]);
    parseSheet(csvTxt);
    parseLog(logTxt);
    if(tgtTxt)parseTargetSheet(tgtTxt);
    if(nurTxt)parseNursery(nurTxt);
    const yrsData=new Set();
    Object.values(sheetMap).forEach(r=>{const d=parseDate(r.tglPartisipasi);if(d)yrsData.add(d.getFullYear());});
    Object.keys(targetData).forEach(y=>yrsData.add(+y));
    years=[...yrsData].sort((a,b)=>a-b);
    currentYear=years.length?String(years[years.length-1]):'all';
    render();
    initSebaran().catch(e=>console.error('Peta sebaran gagal dimuat:',e));
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
<script src="auth-guard.js"></script>
</body>
</html>
