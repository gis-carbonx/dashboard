<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#356760;--primary-md:#618273;--primary-lt:#B5BBA9;--primary-bg:#FFFAF3;
  --dark:#3A342C;
  --bg:#FFFAF3;--surface:#fff;--border:#DCDACC;--border-lt:#EDE7D8;
  --text:#1a2332;--text-2:#64748b;--text-3:#a0aec0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 20px 60px rgba(0,0,0,.2);
}
html,body{font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}

.site-navbar{
  height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 32px;background-color:#FFFAF3;border-bottom:1px solid #DCDACC;

}
.site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}

.site-navbar-spacer{justify-self:end}
@media (max-width:768px){
  .site-navbar{grid-template-columns:auto auto;padding:0 16px}
  .site-navbar-menu{gap:14px;justify-self:end}

.dashboard-frame{margin:0 28px 28px 28px;border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.10);background:#fff;overflow:hidden}

.hero{background:var(--dark);color:#fff;padding:36px 0 30px}

.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.filter-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3)}
.fpill{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;font-family:inherit}

.fpill:hover:not(.active){background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-md)}

.sec-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:18px}
.sub-title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 14px}

.grid-row{display:grid;gap:16px;margin-bottom:16px}
.grid-row.r1{grid-template-columns:1fr 1.6fr}
.grid-row.r2{grid-template-columns:1fr 1fr 1fr}
@media(max-width:980px){.grid-row.r1,.grid-row.r2{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3)}
.card-sub-lbl{font-size:10.5px;color:var(--text-2);margin-top:3px;max-width:360px;line-height:1.4}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:8px}
.card-val{font-size:25px;font-weight:800;color:var(--text)!important;letter-spacing:-.5px;line-height:1.15}
.card-target{text-align:right;flex-shrink:0}
.card-pct{font-size:12px;font-weight:700;color:var(--text)!important;white-space:nowrap}

.progress{height:5px;background:#EDE7D8;border-radius:3px;overflow:hidden;margin:11px 0 13px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary-lt),var(--primary))}
.sub-rows{display:flex;flex-direction:column;gap:7px}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.sub-row-left{display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sub-row-name{color:var(--text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-row-right{display:flex;align-items:baseline;gap:5px;flex-shrink:0}
.sub-row-val{font-weight:700;color:var(--text)!important}
.sub-row-meta{font-size:10px;color:var(--text-3);font-weight:500;white-space:nowrap}

.tanaman-total{font-size:25px;font-weight:800;color:var(--text)!important;letter-spacing:-.5px}
.tanaman-block{margin-top:12px;display:flex;flex-direction:column;gap:11px}
.tanaman-name{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text)}
.tanaman-desc{font-size:10.5px;color:var(--text-2);margin-left:13px;margin-top:2px;line-height:1.4}

.kth-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.kth-total-wrap{display:flex;flex-direction:column}
.kth-total{font-size:25px;font-weight:800;color:var(--text)!important;letter-spacing:-.5px;margin-top:8px}
.kth-total-lbl{font-size:9.5px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.kth-ring{width:58px;height:58px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
.kth-ring::after{content:'';position:absolute;inset:9px;background:#fff;border-radius:50%}
.kth-ring-val{position:relative;z-index:1;font-size:11px;font-weight:800;color:var(--text)}
.kth-bar{display:flex;width:100%;height:9px;border-radius:6px;overflow:hidden;margin:16px 0 16px;background:var(--border-lt)}
.kth-seg{height:100%}
.kth-list{display:flex;flex-wrap:wrap;gap:16px 28px}
.kth-item{min-width:126px}
.kth-item-top{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.kth-item-pct{font-size:15px;font-weight:800;color:var(--text)!important;margin:3px 0 1px}
.kth-item-name{font-size:11.5px;font-weight:600;color:var(--text)}
.kth-item-count{font-size:10.5px;color:var(--text-2);margin-top:1px}
.kth-item-gender{font-size:9.5px;color:var(--text-3);margin-top:3px;display:flex;gap:10px}
.kth-empty{font-size:12px;color:var(--text-3);padding:8px 0}

.card-detail-btn{padding:5px 13px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:10.5px;font-weight:700;color:var(--text-2);cursor:pointer;font-family:inherit}
.card-detail-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

.loading-note{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px}

.modal-overlay{position:fixed;inset:0;z-index:9000;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:#fff;border-radius:14px;width:min(420px,94vw);box-shadow:var(--shadow-lg);overflow:hidden}
.modal-hd{padding:14px 18px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:700}
.modal-close{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:15px;cursor:pointer}
.modal-close:hover{background:rgba(255,255,255,.25)}
.modal-body{padding:18px}
.modal-grp{margin-bottom:16px}
.modal-grp:last-child{margin-bottom:0}
.modal-grp-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-lt)}
.modal-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px}
.modal-row-lbl{color:var(--text-2)}
.modal-row-val{font-weight:700;color:var(--text)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>

<script>
'use strict';
const SHEET_ID='1-LHCIUy1iD154WczY4Da_-iRaILtvL0mOW4gRW6YQac',SHEET_NAME='ARR_SUMMARY',TARGET_NAME='TARGET_CAPAIAN';
const CACHE_BUST='?v='+Date.now();
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
const TARGET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TARGET_NAME)}`;

const PROG={
  Agro_Reg:{label:'Agro Reguler',group:'agro',dot:'#1a6b3a'},
  Agro_BPO:{label:'Bantuan Pupuk Organik',group:'agro',dot:'#0d5c8a'},
  Temb_Reg:{label:'Temb. Reguler',group:'temb',dot:'#b84c00'},
  Temb_MTL:{label:'Menjaga Tutupan Lahan',group:'temb',dot:'#7b1fa2'},
};
const KTH_COLORS=['#356760','#618273','#8C9F8B','#B5BBA9','#94a89c','#6f8378'];

const str=v=>(v??'').toString().trim();
const num=v=>parseFloat(str(v))||0;
const fmt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseDate(s){
  if(!s)return null;const c=str(s).trim();
  const m=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  const d=new Date(c);return isNaN(d)?null:d;
}
function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
function resolveProgram(aReg,aBPO,tReg,tMTL,tipe){
  if(aReg>0)return'Agro_Reg';if(aBPO>0)return'Agro_BPO';
  if(tReg>0)return'Temb_Reg';if(tMTL>0)return'Temb_MTL';
  const t=tipe.toLowerCase();
  return t.includes('tembawang')?'Temb_Reg':t.includes('agro')?'Agro_Reg':null;
}

let sheetMap={},targetData={},currentYear='all',years=[];

async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

function parseSheet(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  data.forEach(raw=>{
    const id=str(raw['ID_Petak']||raw['id_petak']||raw['ID Petak']||raw['I']||'');if(!id)return;
    const kth=str(raw['KTH']||raw['C']||''),tipe=str(raw['Tipe']||raw['E']||'');
    const petani=str(raw['Petani']||raw['F']||''),jk=str(raw['Jenis Kelamin']||raw['Jenis_Kelamin']||raw['G']||'');
    const tglPartisipasi=str(raw['Tgl_Partisipasi']||raw['Tgl Partisipasi']||raw['J']||'');
    const tglRealisasi=str(raw['Tgl_Realisasi']||raw['Tgl Realisasi']||raw['K']||'');
    const aReg=num(raw['Agro_Reg']||raw['Agro Reg']||raw['L']||0),aBPO=num(raw['Agro_BPO']||raw['Agro BPO']||raw['M']||0);
    const tReg=num(raw['Temb_Reg']||raw['Temb Reg']||raw['N']||0),tMTL=num(raw['Temb_MTL']||raw['Temb MTL']||raw['O']||0);
    const keys=Object.keys(raw);
    const k=i=>keys[i]?str(raw[keys[i]]):'';
    const luasAgro=num(raw['AT']||raw['Luas_Agro']||raw['luas_agro']||k(45)||0);
    const luasTemb=num(raw['AU']||raw['Luas_Temb']||raw['luas_temb']||k(46)||0);
    const jumlahTanaman=num(raw['AX']||raw['Jumlah_Tanaman']||raw['jumlah_tanaman']||k(49)||0);
    const luasENL=num(pickCI(raw,keys,'ENL'));
    const luasENP=num(pickCI(raw,keys,'ENP'));
    const prog=resolveProgram(aReg,aBPO,tReg,tMTL,tipe);
    if(!prog&&luasENL<=0&&luasENP<=0)return;
    const _luasAgro=luasAgro>0?luasAgro:aReg+aBPO;
    const _luasTemb=luasTemb>0?luasTemb:tReg+tMTL;
    sheetMap[id]={id,kth,petani,jk,tglPartisipasi,tglRealisasi,aReg,aBPO,tReg,tMTL,luasAgro:_luasAgro,luasTemb:_luasTemb,luasENL,luasENP,prog,jumlahTanaman};
  });
}

function parseTargetSheet(csv){
  const {data}=Papa.parse(csv,{header:false,skipEmptyLines:true});
  targetData={};
  data.forEach((row,i)=>{
    if(!i)return;
    const uraian=str(row[0]).toLowerCase(),tahun=parseInt(str(row[2]));
    if(!uraian||isNaN(tahun)||tahun<2000)return;
    const isA=uraian.includes('agro')&&!uraian.includes('bpo');
    const isT=uraian==='tembawang';
    const isENP=uraian==='pa'||uraian.includes('protected');
    const isENL=uraian==='loa'||uraian.includes('logged');
    if(!isA&&!isT&&!isENP&&!isENL)return;
    if(!targetData[tahun])targetData[tahun]={agro_utama:0,temb_utama:0,agro_total:0,temb_total:0,enp_utama:0,enl_utama:0,enp_total:0,enl_total:0};
    const td=targetData[tahun];
    const utama=parseFloat(str(row[1]))||0,total=parseFloat(str(row[15]))||0;
    if(isA){td.agro_utama+=utama;td.agro_total+=total;}
    if(isT){td.temb_utama+=utama;td.temb_total+=total;}
    if(isENP){td.enp_utama+=utama;td.enp_total+=total;}
    if(isENL){td.enl_utama+=utama;td.enl_total+=total;}
  });
}

function matchesFilter(row,field){
  const d=parseDate(row[field]);
  if(!d)return false;
  if(currentYear==='all')return true;
  return d.getFullYear()===+currentYear;
}

function computeTarget(){
  if(currentYear==='all'){
    let agro=0,temb=0,enp=0,enl=0,found=false;
    Object.values(targetData).forEach(td=>{agro+=td.agro_utama||0;temb+=td.temb_utama||0;enp+=td.enp_utama||0;enl+=td.enl_utama||0;found=true;});
    return found?{agro,temb,enp,enl}:{agro:null,temb:null,enp:null,enl:null};
  }
  const td=targetData[+currentYear];
  return td?{agro:td.agro_total??null,temb:td.temb_total??null,enp:td.enp_total??null,enl:td.enl_total??null}:{agro:null,temb:null,enp:null,enl:null};
}

function computeAreas(){
  let agro=0,temb=0,enp=0,enl=0;
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    agro+=r.luasAgro;temb+=r.luasTemb;enp+=r.luasENP;enl+=r.luasENL;
  });
  return{agro,temb,enp,enl};
}

function computeSubProgram(){
  let aRegHa=0,aBPOHa=0,tRegHa=0,tMTLHa=0;
  const pAR=new Set(),pAB=new Set(),pTR=new Set(),pTM=new Set();
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    aRegHa+=r.aReg;aBPOHa+=r.aBPO;tRegHa+=r.tReg;tMTLHa+=r.tMTL;
    const pk=r.petani?.toLowerCase();
    if(pk){if(r.aReg>0)pAR.add(pk);if(r.aBPO>0)pAB.add(pk);if(r.tReg>0)pTR.add(pk);if(r.tMTL>0)pTM.add(pk);}
  });
  return{aRegHa,aBPOHa,tRegHa,tMTLHa,pAR:pAR.size,pAB:pAB.size,pTR:pTR.size,pTM:pTM.size};
}

function computeTanaman(){
  let agroHa=0,tembHa=0,agroTan=0,tembTan=0,agroTotalHa=0,tembTotalHa=0;
  Object.values(sheetMap).forEach(r=>{
    const grp=PROG[r.prog]?.group;
    if(matchesFilter(r,'tglPartisipasi')){
      if(grp==='agro')agroTotalHa+=r.luasAgro;else if(grp==='temb')tembTotalHa+=r.luasTemb;
    }
    if(matchesFilter(r,'tglRealisasi')&&r.jumlahTanaman>0){
      if(grp==='agro'){agroHa+=r.luasAgro;agroTan+=r.jumlahTanaman;}
      else if(grp==='temb'){tembHa+=r.luasTemb;tembTan+=r.jumlahTanaman;}
    }
  });
  return{agroHa,tembHa,agroTan,tembTan,agroTotalHa,tembTotalHa};
}

function computeKTH(){
  const byKTH={};
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    if(!r.petani||!str(r.jk).trim())return; // jenis kelamin kosong -> tidak dihitung anggota
    const pk=r.petani.toLowerCase();
    if(!byKTH[r.kth])byKTH[r.kth]={all:new Set(),laki:new Set(),pmp:new Set()};
    byKTH[r.kth].all.add(pk);
    const jkLow=r.jk.toLowerCase();
    if(jkLow.includes('laki'))byKTH[r.kth].laki.add(pk);
    else if(jkLow.includes('perempuan'))byKTH[r.kth].pmp.add(pk);
  });
  const list=Object.entries(byKTH).filter(([n])=>n).map(([name,v])=>({name,total:v.all.size,laki:v.laki.size,pmp:v.pmp.size})).sort((a,b)=>b.total-a.total);
  const grandTotal=list.reduce((s,k)=>s+k.total,0);
  return{list,grandTotal};
}

function computeEnrichmentBreakdown(){
  let enpTReg=0,enpBPO=0,enpMTL=0,enlTReg=0,enlMTL=0;
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    if(r.luasENP>0){
      enpTReg+=r.luasENP-r.aBPO-r.tMTL;enpBPO+=r.aBPO;enpMTL+=r.tMTL;
    }else if(r.luasENL>0){
      enlTReg+=r.luasENL-r.tMTL;enlMTL+=r.tMTL;
    }
  });
  return{enpTReg,enpBPO,enpMTL,enlTReg,enlMTL};
}

function pctLine(val,target){
  if(target===null||target===undefined||target<=0)return{pctTxt:'',barPct:0};
  const p=val/target*100;
  return{pctTxt:p.toFixed(1)+'% dari target',barPct:Math.min(100,p)};
}
function targetSub(target){
  if(target===null||target===undefined)return'';
  const yLbl=currentYear==='all'?'':' '+currentYear;
  return`Target${yLbl}: ${fmt(target)} ha`;
}
function tanamanDesc(planted,total,tanaman){
  if(total===null||total===undefined||total<=0)return`${fmt(planted)} ha ditanam · ${fmtInt(tanaman)} tanaman`;
  const pct=planted/total*100;
  return`${fmt(planted)} ha ditanam dari ${fmt(total)} ha (${pct.toFixed(1)}%) · ${fmtInt(tanaman)} tanaman`;
}

function setFilter(y){
  currentYear=y;
  document.querySelectorAll('.fpill').forEach(b=>b.classList.toggle('active',b.dataset.val===String(y)));
  render();
}

function render(){
  const tgt=computeTarget();
  const areas=computeAreas();
  const sub=computeSubProgram();
  const tan=computeTanaman();
  const kth=computeKTH();

  const totalHa=areas.agro+areas.temb;
  const totalTgt=(tgt.agro!==null&&tgt.temb!==null)?tgt.agro+tgt.temb:null;
  const totalLine=pctLine(totalHa,totalTgt);
  const agroLine=pctLine(areas.agro,tgt.agro);
  const tembLine=pctLine(areas.temb,tgt.temb);
  const enrTotalHa=areas.enp+areas.enl;
  const enrTgt=(tgt.enp!==null&&tgt.enl!==null)?tgt.enp+tgt.enl:null;
  const enrLine=pctLine(enrTotalHa,enrTgt);

  // KTH ring (conic-gradient) & bar
  let ringGrad='',barSegs='',cum=0;
  kth.list.forEach((k,i)=>{
    const pct=kth.grandTotal>0?(k.total/kth.grandTotal*100):0;
    const color=KTH_COLORS[i%KTH_COLORS.length];
    ringGrad+=`${color} ${cum}% ${cum+pct}%,`;
    barSegs+=`<div class="kth-seg" style="width:${pct}%;background:${color}"></div>`;
    cum+=pct;
  });
  ringGrad=ringGrad?ringGrad.slice(0,-1):'#EDE7D8 0% 100%';

  const kthItems=kth.list.length?kth.list.map((k,i)=>{
    const pct=kth.grandTotal>0?(k.total/kth.grandTotal*100):0;
    const color=KTH_COLORS[i%KTH_COLORS.length];
    return`<div class="kth-item">
      <div class="kth-item-top"><span class="dot" style="background:${color}"></span>${esc(k.name)}</div>
      <div class="kth-item-pct">${pct.toFixed(1)}%</div>
      <div class="kth-item-count">${k.total} peserta</div>
      <div class="kth-item-gender">L: ${k.laki}&nbsp;&nbsp;P: ${k.pmp}</div>
    </div>`;
  }).join(''):'<div class="kth-empty">Belum ada data peserta KTH untuk periode ini.</div>';

  const body=`
    <div class="filter-row">
      <span class="filter-lbl">Filter</span>
      <button class="fpill${currentYear==='all'?' active':''}" data-val="all" onclick="setFilter('all')">All</button>
      ${years.map(y=>`<button class="fpill${currentYear===String(y)?' active':''}" data-val="${y}" onclick="setFilter('${y}')">${y}</button>`).join('')}
    </div>

    <div class="sec-title">Summary</div>
    <div class="sub-title">Agroforestry and Restoration</div>

    <div class="grid-row r1">
      <div class="card">
        <div class="card-lbl">Total Lahan</div>
        <div class="card-top">
          <div class="card-val">${fmt(totalHa)} ha</div>
          <div class="card-target">
            ${totalLine.pctTxt?`<div class="card-pct">${totalLine.pctTxt}</div>`:''}
            ${totalTgt!==null?`<div class="card-target-sub">${targetSub(totalTgt)}</div>`:''}
          </div>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${totalLine.barPct}%"></div></div>
        <div class="sub-rows">
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:#40c074"></span><span class="sub-row-name">Agroforestri</span></div><span class="sub-row-val">${fmt(areas.agro)} ha</span></div>
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:#ff8c38"></span><span class="sub-row-name">Tembawang</span></div><span class="sub-row-val">${fmt(areas.temb)} ha</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-lbl">Peserta KTH</div>
        <div class="card-sub-lbl">Jumlah petani yang tergabung dalam kelompok tani hutan (KTH)</div>
        <div class="kth-card-top">
          <div class="kth-total-wrap">
            <div class="kth-total">${kth.grandTotal}</div>
            <div class="kth-total-lbl">Total Peserta</div>
          </div>
          <div class="kth-ring" style="background:conic-gradient(${ringGrad})"><span class="kth-ring-val">${kth.grandTotal}</span></div>
        </div>
        <div class="kth-bar">${barSegs}</div>
        <div class="kth-list">${kthItems}</div>
      </div>
    </div>

    <div class="grid-row r2">
      <div class="card">
        <div class="card-lbl">Agroforestri</div>
        <div class="card-top">
          <div class="card-val">${fmt(areas.agro)} ha</div>
          <div class="card-target">
            ${agroLine.pctTxt?`<div class="card-pct">${agroLine.pctTxt}</div>`:''}
            ${tgt.agro!==null?`<div class="card-target-sub">${targetSub(tgt.agro)}</div>`:''}
          </div>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${agroLine.barPct}%"></div></div>
        <div class="sub-rows">
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:${PROG.Agro_Reg.dot}"></span><span class="sub-row-name">Agro Reguler</span></div><div class="sub-row-right"><span class="sub-row-val">${fmt(sub.aRegHa)} ha</span><span class="sub-row-meta">${sub.pAR} petani</span></div></div>
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:${PROG.Agro_BPO.dot}"></span><span class="sub-row-name">Bantuan Pupuk Organik</span></div><div class="sub-row-right"><span class="sub-row-val">${fmt(sub.aBPOHa)} ha</span><span class="sub-row-meta">${sub.pAB} petani</span></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-lbl">Tembawang</div>
        <div class="card-top">
          <div class="card-val">${fmt(areas.temb)} ha</div>
          <div class="card-target">
            ${tembLine.pctTxt?`<div class="card-pct">${tembLine.pctTxt}</div>`:''}
            ${tgt.temb!==null?`<div class="card-target-sub">${targetSub(tgt.temb)}</div>`:''}
          </div>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${tembLine.barPct}%;background:linear-gradient(90deg,#ffb27a,#b84c00)"></div></div>
        <div class="sub-rows">
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:${PROG.Temb_Reg.dot}"></span><span class="sub-row-name">Temb. Reguler</span></div><div class="sub-row-right"><span class="sub-row-val">${fmt(sub.tRegHa)} ha</span><span class="sub-row-meta">${sub.pTR} petani</span></div></div>
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:${PROG.Temb_MTL.dot}"></span><span class="sub-row-name">Menjaga Tutupan Lahan</span></div><div class="sub-row-right"><span class="sub-row-val">${fmt(sub.tMTLHa)} ha</span><span class="sub-row-meta">${sub.pTM} petani</span></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-lbl">Jumlah Tanaman</div>
        <div class="tanaman-total">${fmtInt(tan.agroTan+tan.tembTan)}</div>
        <div class="tanaman-block">
          <div>
            <div class="tanaman-name"><span class="dot" style="background:#40c074"></span>Agroforestri</div>
            <div class="tanaman-desc">${tanamanDesc(tan.agroHa,tan.agroTotalHa,tan.agroTan)}</div>
          </div>
          <div>
            <div class="tanaman-name"><span class="dot" style="background:#ff8c38"></span>Tembawang</div>
            <div class="tanaman-desc">${tanamanDesc(tan.tembHa,tan.tembTotalHa,tan.tembTan)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="sub-title">Enrichment</div>
    <div class="grid-row r2">
      <div class="card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div class="card-lbl">Program Enrichment</div>
          <button class="card-detail-btn" onclick="openEnrModal()">Detail</button>
        </div>
        <div class="card-top" style="margin-top:6px">
          <div class="card-val">${fmt(enrTotalHa)} ha</div>
          <div class="card-target">
            ${enrLine.pctTxt?`<div class="card-pct">${enrLine.pctTxt}</div>`:''}
            ${enrTgt!==null?`<div class="card-target-sub">${targetSub(enrTgt)}</div>`:''}
          </div>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${enrLine.barPct}%;background:linear-gradient(90deg,#7dd3fc,#0369a1)"></div></div>
        <div class="sub-rows">
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:#0ea5e9"></span><span class="sub-row-name">ENP (Protected Area)</span></div><span class="sub-row-val">${fmt(areas.enp)} ha</span></div>
          <div class="sub-row"><div class="sub-row-left"><span class="dot" style="background:#f59e0b"></span><span class="sub-row-name">ENL (Logged Over Area)</span></div><span class="sub-row-val">${fmt(areas.enl)} ha</span></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('pageBody').innerHTML=body;
}

function openEnrModal(){
  const b=computeEnrichmentBreakdown();
  document.getElementById('enrModalBody').innerHTML=`
    <div class="modal-grp">
      <div class="modal-grp-ttl">ENP (Protected Area)</div>
      <div class="modal-row"><span class="modal-row-lbl">Pengkayaan</span><span class="modal-row-val">${fmt(b.enpTReg)} ha</span></div>
      <div class="modal-row"><span class="modal-row-lbl">Bantuan Pupuk Organik</span><span class="modal-row-val">${fmt(b.enpBPO)} ha</span></div>
      <div class="modal-row"><span class="modal-row-lbl">Menjaga Tutupan Lahan</span><span class="modal-row-val">${fmt(b.enpMTL)} ha</span></div>
    </div>
    <div class="modal-grp">
      <div class="modal-grp-ttl">ENL (Logged Over Area)</div>
      <div class="modal-row"><span class="modal-row-lbl">Pengkayaan</span><span class="modal-row-val">${fmt(b.enlTReg)} ha</span></div>
      <div class="modal-row"><span class="modal-row-lbl">Menjaga Tutupan Lahan</span><span class="modal-row-val">${fmt(b.enlMTL)} ha</span></div>
    </div>`;
  document.getElementById('enrModal').style.display='flex';
}
function closeEnrModal(){document.getElementById('enrModal').style.display='none';}

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [csvTxt,tgtTxt]=await Promise.all([getText(CSV_URL),getText(TARGET_URL).catch(()=>'')]);
    parseSheet(csvTxt);
    if(tgtTxt)parseTargetSheet(tgtTxt);
    const yrsData=new Set();
    Object.values(sheetMap).forEach(r=>{const d=parseDate(r.tglPartisipasi);if(d)yrsData.add(d.getFullYear());});
    Object.keys(targetData).forEach(y=>yrsData.add(+y));
    years=[...yrsData].sort((a,b)=>a-b);
    currentYear=years.length?String(years[years.length-1]):'all';
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
</body>
</html>
