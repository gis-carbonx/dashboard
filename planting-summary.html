<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Planting Summary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#356760;--primary-md:#618273;--primary-lt:#B5BBA9;--primary-bg:#FFFAF3;
  --dark:#3A342C;
  --bg:#FFFAF3;--surface:#fff;--border:#DCDACC;--border-lt:#EDE7D8;
  --text:#1a2332;--text-2:#64748b;--text-3:#a0aec0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 20px 60px rgba(0,0,0,.2);
}
html,body{height:100%;overflow:hidden;font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column}

.site-navbar{
  flex-shrink:0;
  height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 32px;background-color:#FFFAF3;border-bottom:1px solid #DCDACC;
  font-family:'Libre Franklin',system-ui,sans-serif;
}
.site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
.site-navbar-brand img{width:26px;height:26px;object-fit:contain}
.site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:#356760}
.site-navbar-menu{display:flex;gap:32px;justify-self:center}
.site-navbar-menu a{text-decoration:none;color:#618273;font-size:13px;font-weight:500}
.site-navbar-menu a:hover,.site-navbar-menu a.active{color:#356760}
.site-navbar-spacer{justify-self:end}
@media (max-width:768px){
  .site-navbar{grid-template-columns:auto auto;padding:0 16px}
  .site-navbar-menu{gap:14px;justify-self:end}
  .site-navbar-spacer{display:none}
}

.dashboard-frame{flex:1;min-height:0;margin:0 28px 28px 28px;border:1px solid var(--border);box-shadow:0 6px 22px rgba(0,0,0,.10);background:#fff;overflow:hidden;display:flex;flex-direction:column}

.hero{background:var(--dark);color:#fff;padding:14px 0;flex-shrink:0}
.hero-inner{max-width:1180px;margin:0 auto;padding:0 36px}
.hero-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.2px}
.hero-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
.hero-date{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}

.page-scroll{flex:1;min-height:0;overflow-y:auto}
.page-body-inner{max-width:1180px;margin:0 auto;padding:28px 36px 48px}

.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.filter-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3)}
.fpill{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;font-family:inherit}
.fpill.active{background:var(--primary);border-color:var(--primary);color:#fff}
.fpill:hover:not(.active){background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-md)}

.sec-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:18px}
.sub-title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 14px}
.sub-title:not(:first-of-type){margin-top:28px}
.page-note{font-size:12px;color:var(--text-2);line-height:1.65;margin:16px 0 28px}

.grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,260px));gap:16px;margin-bottom:16px}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px 22px}
.card-lbl{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:14px}
.card-val-lg{font-size:32px;font-weight:800;color:var(--primary)!important;line-height:1}

.loading-note{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-title">Planning and Planting</div>
      <div class="hero-sub">Implementasi Program PT Citra Mulia Inti</div>
      <div class="hero-date" id="heroDate">Memuat tanggal...</div>
    </div>
  </div>

  <div class="page-scroll">
    <div class="page-body-inner" id="pageBody"><div class="loading-note">Memuat data ringkasan...</div></div>
  </div>
</div>

<script>
'use strict';
const SHEET_ID='1-LHCIUy1iD154WczY4Da_-iRaILtvL0mOW4gRW6YQac',SHEET_NAME='ARR_SUMMARY',TARGET_NAME='TARGET_CAPAIAN';
const CACHE_BUST='?v='+Date.now();
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
const TARGET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TARGET_NAME)}`;

const str=v=>(v??'').toString().trim();
const num=v=>parseFloat(str(v))||0;
const fmt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=v=>(+v||0).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=x=>str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseDate(s){
  if(!s)return null;const c=str(s).trim();
  const m=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  const d=new Date(c);return isNaN(d)?null:d;
}
function pickCI(raw,keys,...names){
  const norm=s=>s.toString().trim().toLowerCase();
  const wanted=names.map(norm);
  for(const kk of keys){if(wanted.includes(norm(kk)))return raw[kk];}
  return undefined;
}
function resolveProgram(aReg,aBPO,tReg,tMTL,tipe){
  if(aReg>0)return'Agro_Reg';if(aBPO>0)return'Agro_BPO';
  if(tReg>0)return'Temb_Reg';if(tMTL>0)return'Temb_MTL';
  const t=tipe.toLowerCase();
  return t.includes('tembawang')?'Temb_Reg':t.includes('agro')?'Agro_Reg':null;
}

let sheetMap={},targetData={},currentYear='all',years=[];

async function getText(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text();}

function parseSheet(csv){
  const {data}=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  data.forEach(raw=>{
    const id=str(raw['ID_Petak']||raw['id_petak']||raw['ID Petak']||raw['I']||'');if(!id)return;
    const kth=str(raw['KTH']||raw['C']||''),tipe=str(raw['Tipe']||raw['E']||'');
    const petani=str(raw['Petani']||raw['F']||''),jk=str(raw['Jenis Kelamin']||raw['Jenis_Kelamin']||raw['G']||'');
    const tglPartisipasi=str(raw['Tgl_Partisipasi']||raw['Tgl Partisipasi']||raw['J']||'');
    const tglRealisasi=str(raw['Tgl_Realisasi']||raw['Tgl Realisasi']||raw['K']||'');
    const aReg=num(raw['Agro_Reg']||raw['Agro Reg']||raw['L']||0),aBPO=num(raw['Agro_BPO']||raw['Agro BPO']||raw['M']||0);
    const tReg=num(raw['Temb_Reg']||raw['Temb Reg']||raw['N']||0),tMTL=num(raw['Temb_MTL']||raw['Temb MTL']||raw['O']||0);
    const keys=Object.keys(raw);
    const k=i=>keys[i]?str(raw[keys[i]]):'';
    const luasAgro=num(raw['AT']||raw['Luas_Agro']||raw['luas_agro']||k(45)||0);
    const luasTemb=num(raw['AU']||raw['Luas_Temb']||raw['luas_temb']||k(46)||0);
    const jumlahTanaman=num(raw['AX']||raw['Jumlah_Tanaman']||raw['jumlah_tanaman']||k(49)||0);
    const luasENL=num(pickCI(raw,keys,'ENL'));
    const luasENP=num(pickCI(raw,keys,'ENP'));
    const prog=resolveProgram(aReg,aBPO,tReg,tMTL,tipe);
    if(!prog&&luasENL<=0&&luasENP<=0)return;
    const _luasAgro=luasAgro>0?luasAgro:aReg+aBPO;
    const _luasTemb=luasTemb>0?luasTemb:tReg+tMTL;
    sheetMap[id]={id,kth,petani,jk,tglPartisipasi,tglRealisasi,aReg,aBPO,tReg,tMTL,luasAgro:_luasAgro,luasTemb:_luasTemb,luasENL,luasENP,prog,jumlahTanaman};
  });
}

function parseTargetSheet(csv){
  const {data}=Papa.parse(csv,{header:false,skipEmptyLines:true});
  targetData={};
  data.forEach((row,i)=>{
    if(!i)return;
    const uraian=str(row[0]).toLowerCase(),tahun=parseInt(str(row[2]));
    if(!uraian||isNaN(tahun)||tahun<2000)return;
    const isA=uraian.includes('agro')&&!uraian.includes('bpo');
    const isT=uraian==='tembawang';
    const isENP=uraian==='pa'||uraian.includes('protected');
    const isENL=uraian==='loa'||uraian.includes('logged');
    if(!isA&&!isT&&!isENP&&!isENL)return;
    if(!targetData[tahun])targetData[tahun]={agro_utama:0,temb_utama:0,agro_total:0,temb_total:0,enp_utama:0,enl_utama:0,enp_total:0,enl_total:0};
    const td=targetData[tahun];
    const utama=parseFloat(str(row[1]))||0,total=parseFloat(str(row[15]))||0;
    if(isA){td.agro_utama+=utama;td.agro_total+=total;}
    if(isT){td.temb_utama+=utama;td.temb_total+=total;}
    if(isENP){td.enp_utama+=utama;td.enp_total+=total;}
    if(isENL){td.enl_utama+=utama;td.enl_total+=total;}
  });
}

function matchesFilter(row,field){
  const d=parseDate(row[field]);
  if(!d)return false;
  if(currentYear==='all')return true;
  return d.getFullYear()===+currentYear;
}

function computeAreas(){
  let agro=0,temb=0,enp=0,enl=0;
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    agro+=r.luasAgro;temb+=r.luasTemb;enp+=r.luasENP;enl+=r.luasENL;
  });
  return{agro,temb,enp,enl};
}

function computeTanamanTotal(){
  let total=0;
  Object.values(sheetMap).forEach(r=>{
    if(matchesFilter(r,'tglRealisasi')&&r.jumlahTanaman>0)total+=r.jumlahTanaman;
  });
  return total;
}

function computePesertaTotal(){
  const all=new Set();
  Object.values(sheetMap).forEach(r=>{
    if(!matchesFilter(r,'tglPartisipasi'))return;
    if(!r.petani||!str(r.jk).trim())return; // jenis kelamin kosong -> tidak dihitung anggota
    all.add(r.petani.toLowerCase());
  });
  return all.size;
}

function computeKTHCount(){
  const set=new Set();
  Object.values(sheetMap).forEach(r=>{
    const v=str(r.kth).trim();
    if(v&&v.toLowerCase().includes('kth'))set.add(v.toLowerCase());
  });
  return set.size;
}

function computePetakCount(){
  let n=0;
  Object.values(sheetMap).forEach(r=>{if(matchesFilter(r,'tglPartisipasi'))n++;});
  return n;
}

function yearLabel(){
  return currentYear==='all'?'semua tahun':String(currentYear);
}

function setFilter(y){
  currentYear=y;
  document.querySelectorAll('.fpill').forEach(b=>b.classList.toggle('active',b.dataset.val===String(y)));
  render();
}

function render(){
  const areas=computeAreas();
  const totalHa=areas.agro+areas.temb;
  const enrTotalHa=areas.enp+areas.enl;
  const pesertaTotal=computePesertaTotal();
  const tanamanTotal=computeTanamanTotal();
  const kthCount=computeKTHCount();
  const petakCount=computePetakCount();
  const note1=`Dalam periode ${yearLabel()}, luas area program adalah ${fmt(totalHa)} ha. Setiap lahan agroforestri, tergabung pada paling tidak satu dari ${fmtInt(kthCount)} KTH yang ada. Dimana terdapat ${fmtInt(petakCount)} petak, yang dikelola oleh ${fmtInt(pesertaTotal)} individu penggarap lahan.`;

  const body=`
    <div class="filter-row">
      <span class="filter-lbl">Filter</span>
      <button class="fpill${currentYear==='all'?' active':''}" data-val="all" onclick="setFilter('all')">All</button>
      ${years.map(y=>`<button class="fpill${currentYear===String(y)?' active':''}" data-val="${y}" onclick="setFilter('${y}')">${y}</button>`).join('')}
    </div>

    <div class="sec-title">Summary</div>
    <div class="sub-title">Agroforestry and Restoration</div>

    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Total Lahan</div>
        <div class="card-val-lg">${fmt(totalHa)} ha</div>
      </div>
      <div class="card">
        <div class="card-lbl">Unik Peserta Program</div>
        <div class="card-val-lg">${fmtInt(pesertaTotal)}</div>
      </div>
    </div>

    <p class="page-note">${note1}</p>

    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Agroforestri</div>
        <div class="card-val-lg">${fmt(areas.agro)} ha</div>
      </div>
      <div class="card">
        <div class="card-lbl">Tembawang</div>
        <div class="card-val-lg">${fmt(areas.temb)} ha</div>
      </div>
    </div>

    <p class="page-note">
      [placeholder 2] Lorem ipsum dolor sit amet, consectetur adipiscing elit. Etiam rutrum massa lorem, eget
      gravida odio dapibus feugiat. Curabitur egestas dapibus justo, et varius odio pharetra vel.
    </p>

    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Jumlah Tanaman</div>
        <div class="card-val-lg">${fmtInt(tanamanTotal)}</div>
      </div>
    </div>

    <div class="sub-title">Enrichment</div>
    <div class="grid-row">
      <div class="card">
        <div class="card-lbl">Program Enrichment</div>
        <div class="card-val-lg">${fmt(enrTotalHa)} ha</div>
      </div>
    </div>
  `;
  document.getElementById('pageBody').innerHTML=body;
}

(async function boot(){
  try{
    document.getElementById('heroDate').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    const [csvTxt,tgtTxt]=await Promise.all([getText(CSV_URL),getText(TARGET_URL).catch(()=>'')]);
    parseSheet(csvTxt);
    if(tgtTxt)parseTargetSheet(tgtTxt);
    const yrsData=new Set();
    Object.values(sheetMap).forEach(r=>{const d=parseDate(r.tglPartisipasi);if(d)yrsData.add(d.getFullYear());});
    Object.keys(targetData).forEach(y=>yrsData.add(+y));
    years=[...yrsData].sort((a,b)=>a-b);
    currentYear=years.length?String(years[years.length-1]):'all';
    render();
  }catch(err){
    console.error('LOAD ERROR:',err);
    document.getElementById('pageBody').innerHTML=`<div class="loading-note">⚠ Gagal memuat data: ${esc(String(err?.message||err))}</div>`;
  }
})();
</script>
</body>
</html>
