<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Satellite Tracker | Sanggala Corridor Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<style>
  :root{
    --color-cream:#FFFAF3;
    --color-sand:#DCDACC;
    --color-sage:#B5BBA9;
    --color-moss:#8C9F8B;
    --color-fern:#618273;
    --color-pine:#356760;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Libre Franklin', sans-serif;background:var(--color-cream)}
  body{display:flex;flex-direction:column}

  .site-navbar{
    flex-shrink:0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    height:56px;padding:0 32px;
    background-color:var(--color-cream);
    border-bottom:1px solid var(--color-sand);
  }
  .site-navbar-brand{display:flex;align-items:center;gap:10px;justify-self:start}
  .site-navbar-brand img{width:28px;height:28px;object-fit:contain}
  .site-navbar-brand span{font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--color-pine)}
  .site-navbar-menu{display:flex;gap:32px;justify-self:center}
  .site-navbar-menu a{text-decoration:none;color:var(--color-fern);font-size:13px;font-weight:500}
  .site-navbar-menu a:hover,.site-navbar-menu a.active{color:var(--color-pine)}
  .site-navbar-spacer{justify-self:end}
  @media (max-width:768px){
    .site-navbar{grid-template-columns:auto auto;padding:0 16px}
    .site-navbar-menu{gap:14px;justify-self:end}
    .site-navbar-spacer{display:none}
  }

  .dashboard-frame{
    flex:1;min-height:0;
    margin:0 28px 28px 28px;
    border-radius:0;
    border:1px solid var(--color-sand);
    overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.08);
    display:flex;flex-direction:column;
    background:#fff;
    position:relative;
  }

  /* Header gelap, sama seperti patrol-summary & monitoring-fire-event */
  .frame-header{flex-shrink:0;background:#3A342C;border-bottom:1px solid #4a4238;padding:14px 0}
  .frame-header-inner{
    max-width:1180px;margin:0 auto;padding:0 36px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .frame-title{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.2px}
  .frame-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
  .frame-open-link{
    font-size:11px;font-weight:600;color:#fff;text-decoration:none;
    border:1px solid rgba(255,255,255,.35);padding:7px 14px;border-radius:20px;white-space:nowrap;
    transition:background .15s;
  }
  .frame-open-link:hover{background:rgba(255,255,255,.1)}

  /* Menu samping + laporan, mengisi sisa tinggi frame */
  /* Gutter scrollbar disediakan seperti halaman lain agar posisi konten tidak bergeser */
  .page-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;display:flex}
  .content-row{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px 36px;display:flex;align-items:flex-start;gap:20px}
  .side-menu{width:60px;flex-shrink:0;background:#3A342C;border-radius:18px;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .side-item{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;flex-shrink:0;text-decoration:none;color:rgba(255,255,255,.5);transition:background .15s,color .15s}
  .side-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-item:hover{background:rgba(255,255,255,.1);color:#fff}
  .side-item.active{background:#fff;color:#3A342C;border-radius:50%}

  .iframe-wrap{flex:1;align-self:stretch;min-width:0;position:relative;background:var(--color-cream);border:1px solid var(--color-sand);border-radius:14px;overflow:hidden}
  .iframe-wrap iframe{width:100%;height:100%;border:none;display:block}

  .iframe-loading{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:var(--color-cream);color:var(--color-fern);font-size:12px;
  }
  .spinner{
    width:28px;height:28px;border:3px solid var(--color-sand);border-top-color:var(--color-fern);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="site-navbar">
  <div class="site-navbar-brand">
    <img src="assets/logo/Sanggala_color.png" alt="Logo Sanggala Corridor Project">
    <span>SANGGALA CORRIDOR PROJECT</span>
  </div>
  <nav class="site-navbar-menu">
    <a href="/dashboard/">Home</a>
    <a href="activities.html">Activities</a>
    <a href="list.html" class="active">Dashboard</a>
  </nav>
  <div class="site-navbar-spacer"></div>
</header>

<div class="dashboard-frame">
  <div class="frame-header">
    <div class="frame-header-inner">
      <div>
        <div class="frame-title">Satellite Tracker — Kalimantan Barat</div>
        <div class="frame-sub">Pemantauan titik panas (hotspot) satelit di wilayah Kalimantan Barat</div>
      </div>
      <a class="frame-open-link"
         href="https://g-adzan.github.io/hotspot_sattrack/"
         target="_blank" rel="noopener noreferrer">Buka di Tab Baru ↗</a>
    </div>
  </div>
  <div class="page-scroll">
  <div class="content-row">
  <nav class="side-menu">
    <a class="side-item" href="patrol-summary.html" title="Main Page" aria-label="Main Page"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10v9.5a1 1 0 0 0 1 1h3v-6h3v6h3a1 1 0 0 0 1-1V10"/></svg></a>
    <a class="side-item" href="monitoring-fire-event.html" title="Fire Alert" aria-label="Fire Alert"><svg viewBox="0 0 24 24"><path d="M12 3c.4 3-2.6 4.6-2.6 7.6 0 .9.3 1.7.8 2.3C8 12.6 6.5 10.9 6.5 9 4.9 10.6 4 12.7 4 14.9 4 18.8 7.6 21 12 21s8-2.2 8-6.1C20 9.6 15.4 6.2 12 3Z"/><path d="M12 21c-1.8 0-3-1.1-3-2.7 0-1.9 1.6-2.8 3-4.8 1.4 2 3 2.9 3 4.8 0 1.6-1.2 2.7-3 2.7Z"/></svg></a>
    <a class="side-item active" href="satellite-tracker.html" title="Satellite Tracker" aria-label="Satellite Tracker"><svg viewBox="0 0 24 24"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg></a>
    <a class="side-item" href="land-clearing-alert.html" title="Land Clearing Alert" aria-label="Land Clearing Alert"><svg viewBox="0 0 24 24"><path d="M9 3 4.5 9.5h2.3L3.5 14.5h11L11.2 9.5h2.3Z"/><path d="M9 14.5V20"/><path d="M15.5 20h5"/><path d="M16.5 20v-3h3v3"/></svg></a>
    <a class="side-item" href="community-fire-management.html" title="Community Fire Management" aria-label="Community Fire Management"><svg viewBox="0 0 24 24"><circle cx="9.2" cy="8.3" r="2.9"/><path d="M3.5 19.5c0-3.1 2.5-5.7 5.7-5.7s5.7 2.6 5.7 5.7"/><circle cx="16.8" cy="9" r="2.2"/><path d="M15.4 13.9c2.4.5 4.1 2.6 4.1 5.1"/></svg></a>
    <a class="side-item" href="weather.html" title="Weather" aria-label="Weather"><svg viewBox="0 0 24 24"><path d="M7 15.5a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5a3.5 3.5 0 0 1 .5 7Z"/><path d="M8.5 18.5 7.5 21"/><path d="M12.5 18.5l-1 2.5"/><path d="M16.5 18.5l-1 2.5"/></svg></a>
  </nav>
  <div class="iframe-wrap">
    <div class="iframe-loading" id="loadingOverlay">
      <div class="spinner"></div>
      <span>Memuat Satellite Tracker…</span>
    </div>
    <iframe
      src="https://g-adzan.github.io/hotspot_sattrack/"
      title="Satellite Tracker - Kalimantan Barat"
      allowfullscreen
      onload="document.getElementById('loadingOverlay').style.display='none'">
    </iframe>
  </div>
  </div>
  </div>
</div>

</body>
</html>
